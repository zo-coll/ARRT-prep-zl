    S.remaining--; S.elapsed++; tick++;
    var el = $('#timer'); if(el){ el.textContent = fmt(S.remaining); el.className='timer'+(S.remaining<300?' low':''); }
    if(tick%5===0) saveSession();
    if(S.remaining<=0){ finish(true); }
  },1000);
}

/* ---------- answering ---------- */
function curId(){ return S.ids[S.i]; }
function isCorrect(id){ return S.ans[id]===byId[id].a; }
function record(id){
  if(S.counted[id] || S.ans[id]===undefined) return;
  S.counted[id]=1;
  var h = H[id] || {n:0,c:0}; h.n++; if(isCorrect(id)) h.c++; h.last = isCorrect(id); H[id]=h;
}
function persistH(){ lsSet(HK,H); }
function pick(oi){
  var id=curId();
  if(S.mode==='study' && S.sub[id]) return;
  S.ans[id]=oi; saveSession(); render(true);
}
function submit(){
  var id=curId(); if(S.ans[id]===undefined) return;
  S.sub[id]=1; record(id); persistH(); saveSession(); render(true);
}
function toggleFlag(){
  var id=curId(); S.flag[id]=!S.flag[id];
  var h = H[id] || {n:0,c:0}; h.flag = !!S.flag[id]; H[id]=h; persistH(); saveSession(); render(true);
}
function move(d){
  var n = S.i + d;
  if(n<0) return;
  if(n>=S.ids.length){ go('summary'); return; }
  S.i=n; saveSession(); render(); window.scrollTo(0,0);
}
function jump(i){ S.i=i; showNav=false; if(screen!=='quiz'){ screen='quiz'; startTimer(); } saveSession(); render(); window.scrollTo(0,0); }
function finish(auto){
  S.ids.forEach(record); S.finished=true; persistH(); lsDel(SK);
  if(timerId){ clearInterval(timerId); timerId=null; }
  screen='results'; render(); window.scrollTo(0,0);
}

/* ---------- renderers ---------- */
function qBlock(id, reveal){
  var q=byId[id], perm=S.perm[id], chosen=S.ans[id];
  var h = '<div class="row" style="margin-bottom:6px"><span class="chip">'+esc(catBy[q.c].short)+'</span><span class="chip ghost">'+esc(subName[q.t])+'</span>'+
          (S.flag[id]||(H[id]&&H[id].flag)?'<span class="chip warn">Flagged</span>':'')+'</div>';
  h += '<div class="stem" id="stem">'+esc(q.q)+'</div><div role="radiogroup" aria-labelledby="stem">';
  perm.forEach(function(oi,di){
    var L='ABCD'.charAt(di), isC=(oi===q.a), isCh=(chosen===oi), c='opt', tag='';
    if(reveal){ if(isC){ c+=' correct'; tag='<span class="tag ok">Correct answer</span>'; } else if(isCh){ c+=' wrong'; tag='<span class="tag bad">Your answer</span>'; } }
    else if(isCh) c+=' sel';
    h += '<div class="optwrap"><button class="'+c+'" data-act="pick" data-oi="'+oi+'" role="radio" aria-checked="'+isCh+'"'+(reveal?' disabled':'')+'>'+
         '<span class="let">'+L+'</span><span class="otext">'+esc(q.o[oi])+'</span>'+tag+'</button>';
    if(reveal){
      var k = isC?'ok':(isCh?'bad':'oth');
      var lab = isC?'Why this is correct':(isCh?'Why your answer is incorrect':'Why this is incorrect');
      h += '<div class="why '+k+'"><b>'+lab+'</b>'+esc(q.e[oi])+'</div>';
    }
    h += '</div>';
  });
  return h+'</div>';
}
function navGrid(){
  var h='<div class="nav">';
  S.ids.forEach(function(id,i){
    var c='';
    if(S.mode==='study' && S.sub[id]) c = isCorrect(id)?'ok':'bad';
    else if(S.ans[id]!==undefined) c='ans';
    if(i===S.i && screen==='quiz') c+=' cur';
    if(S.flag[id]) c+=' fl';
    h+='<button class="'+c+'" data-act="jump" data-i="'+i+'" aria-label="Question '+(i+1)+'">'+(i+1)+'</button>';
  });
  return h+'</div>';
}
function topBar(){
  var n=S.ids.length, answered=S.ids.filter(function(id){return S.ans[id]!==undefined;}).length;
  var h='<div class="top"><div class="row"><button class="btn sm ghost" data-act="exit">&larr; Exit</button>'+
    '<span class="chip">'+(S.kind==='mock'?'Mock exam':'Practice')+' &middot; '+(S.mode==='exam'?'Exam mode':'Study mode')+'</span><span class="sp"></span>';
  if(S.timed) h+='<span class="timer'+(S.remaining<300?' low':'')+'" id="timer" title="Time remaining">'+fmt(S.remaining)+'</span>';
  h+='<button class="btn sm" data-act="nav">'+(showNav?'Hide':'Questions')+'</button></div>'+
    '<div class="bar"><i style="width:'+pct(answered,n)+'%"></i></div>'+
    '<div class="small muted" style="margin-top:4px">'+(screen==='quiz'?'Question '+(S.i+1)+' of '+n+' &middot; ':'')+answered+' answered</div>';
  if(showNav) h+=navGrid();
  return h+'</div>';
}
function renderQuiz(){
  var id=curId(), revealed = S.mode==='study' && S.sub[id], ans = S.ans[id]!==undefined;
  var h = topBar() + '<div class="card">' + qBlock(id, revealed);
  if(revealed){
    h = h.replace('<div class="stem" id="stem">', '<div class="verdict '+(isCorrect(id)?'ok':'bad')+'">'+(isCorrect(id)?'✓ Correct':'✗ Incorrect')+'</div><div class="stem" id="stem">');
  }
  h += '<div class="foot"><button class="btn" data-act="prev"'+(S.i===0?' disabled':'')+'>Previous</button>'+
       '<button class="btn" data-act="flag">'+(S.flag[id]?'Unflag':'Flag for review')+'</button><span class="sp"></span>';
  if(S.mode==='study' && !revealed) h+='<button class="btn pri" data-act="submit"'+(ans?'':' disabled')+'>Check answer</button>';
  else h+='<button class="btn pri" data-act="next">'+(S.i===S.ids.length-1?(S.mode==='study'?'Finish':'Review answers'):'Next')+'</button>';
  h += '</div></div><div class="small muted">Keys: <kbd>A</kbd>-<kbd>D</kbd> choose &middot; <kbd>Enter</kbd> '+(S.mode==='study'&&!revealed?'check':'next')+' &middot; <kbd>&larr;</kbd><kbd>&rarr;</kbd> navigate &middot; <kbd>F</kbd> flag</div>';
  root.innerHTML = h;
}
function renderSummary(){
  var n=S.ids.length, un=S.ids.filter(function(id){return S.ans[id]===undefined;}).length, fl=S.ids.filter(function(id){return S.flag[id];}).length;
  var h = topBar().replace(/<div class="small muted"[^]*?<\/div>/,'');
  h += '<div class="card"><h2>Review before you finish</h2><p class="muted">'+(un? '<b>'+un+'</b> unanswered. ':'All questions answered. ')+(fl?'<b>'+fl+'</b> flagged. ':'')+
       'Select any number to go back to that question.</p>'+navGrid()+
       '<div class="foot"><button class="btn" data-act="jump" data-i="0">Return to question 1</button>'+
       (un?'<button class="btn" data-act="firstun">Go to first unanswered</button>':'')+
       (fl?'<button class="btn" data-act="firstfl">Go to first flagged</button>':'')+
       '<span class="sp"></span><button class="btn pri" data-act="finish">Finish &amp; see results</button></div></div>';
  root.innerHTML=h;
}
function stats(ids){
  var r={n:0,c:0,un:0,t:0};
  ids.forEach(function(id){ r.t++; if(S.ans[id]===undefined) r.un++; else { r.n++; if(isCorrect(id)) r.c++; } });
  return r;
}
function barRow(label, a, b, sub){
  var p=pct(a,b);
  return '<div class="hbar"><div>'+esc(label)+(sub?'<div class="small muted">'+sub+'</div>':'')+'</div><div class="track"><i class="'+cls(p)+'" style="width:'+p+'%"></i></div><div class="v">'+p+'% <span class="muted small">('+a+'/'+b+')</span></div></div>';
}
function renderResults(){
  var mock = S.kind==='mock';
  var scoredIds = S.ids.filter(function(id){return !S.pilot[id];});
  var pilotIds = S.ids.filter(function(id){return S.pilot[id];});
  var st = stats(scoredIds), total = scoredIds.length;
  var p = pct(st.c, total);
  var h = '<div class="card"><div class="row" style="gap:24px"><div><div class="big" style="color:var(--'+(p>=75?'ok':(p>=60?'warn':'bad'))+')">'+p+'%</div><div class="muted">'+st.c+' of '+total+' '+(mock?'scored questions ':'questions ')+'correct</div></div>'+
          '<div class="sp"></div><div class="small muted" style="text-align:right">Time used: '+fmt(S.elapsed)+(S.timed?' of '+fmt(S.limit):'')+'<br>Unanswered: '+st.un+'</div></div>';
  if(mock){
    var ps = stats(pilotIds);
    h += '<p class="small muted" style="margin-top:12px">'+pilotIds.length+' hidden pilot questions were not counted toward this score (you answered '+ps.c+' of '+pilotIds.length+' correctly; shown in the review). On the real exam you cannot tell which items are pilot.</p>';
    h += '<div class="note" style="margin-top:10px"><b>Reading this score:</b> ARRT reports a scaled score (75 to pass), not a percentage. ARRT\'s scoring page gives examples where roughly 130 to 131 of 200 correct (about 65%) met the standard on particular exam forms, and this varies by form. This question bank is not statistically calibrated, so use the percentage as a trend to compare against your own earlier attempts and to find weak areas, not as a pass or fail prediction.</div>';
  }
  h += '</div>';
  // by category
  h += '<div class="card"><h2>By content category</h2>';
  CATS.forEach(function(c){
    var ids = scoredIds.filter(function(id){return byId[id].c===c.k;});
    if(!ids.length) return;
    var s=stats(ids); h += barRow(c.name, s.c, ids.length, c.group);
  });
  h += '</div>';
  // by subtopic
  var subs=[];
  CATS.forEach(function(c){ c.subs.forEach(function(sb){
    var ids = scoredIds.filter(function(id){return byId[id].t===sb.k;}); if(!ids.length) return;
    var s=stats(ids); subs.push({n:sb.n, cat:c.short, a:s.c, b:ids.length, p:pct(s.c,ids.length)});
  });});
  subs.sort(function(x,y){ return x.p-y.p || y.b-x.b; });
  h += '<div class="card"><h2>Weakest to strongest topics</h2><p class="small muted">Small topics have few questions, so a single miss moves the percentage a lot.</p>';
  subs.forEach(function(s){ h += barRow(s.n, s.a, s.b, s.cat); });
  h += '</div>';
  h += '<div class="card"><div class="foot" style="margin-top:0"><button class="btn pri" data-act="review" data-f="all">Review all questions</button>'+
       '<button class="btn" data-act="review" data-f="wrong">Review missed</button>'+
       '<button class="btn" data-act="review" data-f="flag">Review flagged</button>'+
       '<span class="sp"></span><button class="btn" data-act="missed">Practice my missed questions</button><button class="btn" data-act="home">Home</button></div></div>';
  root.innerHTML=h;
}
function reviewList(){
  return S.ids.filter(function(id){
    if(rf==='wrong') return S.ans[id]!==undefined && !isCorrect(id);
    if(rf==='flag') return S.flag[id];
    if(rf==='unans') return S.ans[id]===undefined;
    if(rf==='pilot') return S.pilot[id];
    return true;
  });
}
function renderReview(){
  var list = reviewList(); if(ri>=list.length) ri=Math.max(0,list.length-1);
  var h = '<div class="top"><div class="row"><button class="btn sm ghost" data-act="back">&larr; Results</button><span class="chip">Review</span><span class="sp"></span><span class="small muted">'+(list.length?(ri+1)+' of '+list.length:'0 questions')+'</span></div>'+
    '<div class="row" style="margin-top:8px">'+[['all','All'],['wrong','Missed'],['flag','Flagged'],['unans','Unanswered']].concat(S.kind==='mock'?[['pilot','Pilot (unscored)']]:[]).map(function(f){
      return '<span class="pill'+(rf===f[0]?' on':'')+'" data-act="rf" data-f="'+f[0]+'" role="button" tabindex="0">'+f[1]+'</span>'; }).join('')+'</div></div>';
  if(!list.length){ h += '<div class="card muted">No questions match this filter.</div>'; root.innerHTML=h; return; }
  var id=list[ri], got = S.ans[id]!==undefined;
  var v = !got? '<div class="verdict bad">Not answered</div>' : '<div class="verdict '+(isCorrect(id)?'ok':'bad')+'">'+(isCorrect(id)?'✓ Correct':'✗ Incorrect')+'</div>';
  h += '<div class="card"><div class="small muted">Question '+(S.ids.indexOf(id)+1)+(S.pilot[id]?' &middot; unscored pilot item':'')+'</div>'+v;
  var saved=S.i; S.i=S.ids.indexOf(id);
  h += qBlock(id,true); S.i=saved;
  h += '<div class="foot"><button class="btn" data-act="rprev"'+(ri===0?' disabled':'')+'>Previous</button><button class="btn" data-act="rflag">'+(S.flag[id]?'Unflag':'Flag')+'</button><span class="sp"></span><button class="btn pri" data-act="rnext"'+(ri>=list.length-1?' disabled':'')+'>Next</button></div></div>';
  root.innerHTML=h;
}
function renderHome(){
  var saved = lsGet(SK), h='';
  h += '<h1>ARRT Radiography Practice Exam</h1><p class="sub">Built from the Examination Content Specifications effective March 1, 2027 &middot; '+QS.length+' original practice questions with an explanation for every answer choice.</p>';
  if(saved && saved.ids && !saved.finished){
    var done = saved.ids.filter(function(id){return saved.ans && saved.ans[id]!==undefined;}).length;
    h += '<div class="banner"><b>Unfinished '+(saved.kind==='mock'?'mock exam':'practice session')+'</b> &middot; '+done+' of '+saved.ids.length+' answered'+(saved.timed?' &middot; '+fmt(saved.remaining)+' left (timer paused while away)':'')+
         '<div class="row" style="margin-top:8px"><button class="btn pri sm" data-act="resume">Resume</button><button class="btn sm" data-act="discard">Discard</button></div></div>';
  }
  // mode cards
  h += '<div class="grid2"><div class="card"><h2>Full mock exam</h2><p class="muted" style="margin-top:0">All '+QS.length+' questions in random order, laid out like the real exam: '+TOTAL_SCORED+' scored plus '+(QS.length-TOTAL_SCORED)+' hidden unscored pilot items, '+MOCK_MIN+' minutes (the time limit comes from test-prep sources, so confirm it with ARRT), answers and flags can be changed, and no feedback until you finish.</p>'+
       '<button class="btn pri" data-act="mock">Start mock exam</button></div>';
  h += '<div class="card"><h2>Blueprint coverage</h2><table><tr><th>Category</th><th class="num">ARRT scored</th><th class="num">In bank</th></tr>';
  CATS.forEach(function(c){ h+='<tr><td>'+esc(c.name)+'</td><td class="num">'+c.scored+'</td><td class="num">'+catCount(c.k)+'</td></tr>'; });
  h += '<tr><td><b>Total</b></td><td class="num"><b>'+TOTAL_SCORED+'</b></td><td class="num"><b>'+QS.length+'</b></td></tr></table></div></div>';
  // custom
  var pl = pool().length;
  h += '<div class="card"><h2>Custom practice by topic</h2><p class="small muted" style="margin-top:0">Choose what to focus on. Percentages show how you did the last time you answered each question.</p>';
  h += '<div class="row" style="margin-bottom:10px"><button class="btn sm" data-act="selall">Select all</button><button class="btn sm" data-act="selnone">Clear</button>';
  ['Patient Care','Safety','Image Production','Procedures'].forEach(function(g){ h+='<button class="btn sm" data-act="selgroup" data-g="'+g+'">Only '+g+'</button>'; });
  h += '</div>';
  var sel = {}; UI.sel.forEach(function(k){sel[k]=1;});
  CATS.forEach(function(c){
    var nSel = c.subs.filter(function(s){return sel[s.k];}).length;
    var qs = QS.filter(function(q){return q.c===c.k;}), seen = qs.filter(function(q){return H[q.id]&&H[q.id].n;}), good = seen.filter(function(q){return H[q.id].last;});
    h += '<details class="cat"'+(UI.open[c.k]?' open':'')+' data-cat="'+c.k+'"><summary><input type="checkbox" data-act="tcat" data-c="'+c.k+'" '+(nSel===c.subs.length?'checked':'')+' aria-label="Select all of '+esc(c.name)+'">'+
         '<div><b>'+esc(c.name)+'</b><div class="small muted">'+esc(c.group)+' &middot; '+qs.length+' questions</div></div><span class="cnt">'+(seen.length?pct(good.length,seen.length)+'% last time':'not started')+'</span>'+
         '<span class="mini" title="Answered correctly last time"><i style="width:'+pct(good.length,qs.length)+'%"></i></span></summary><div class="subs">';
    c.subs.forEach(function(s){
      var sq = qs.filter(function(q){return q.t===s.k;}), ss=sq.filter(function(q){return H[q.id]&&H[q.id].n;}), sg=ss.filter(function(q){return H[q.id].last;});
      h += '<label class="chk"><input type="checkbox" data-act="tsub" data-s="'+s.k+'" '+(sel[s.k]?'checked':'')+'>'+esc(s.n)+'<span class="cnt">'+sq.length+(ss.length?' &middot; '+pct(sg.length,ss.length)+'%':'')+'</span></label>';
    });
    h += '</div></details>';
  });
  h += '<div class="opts-row">'+
    '<fieldset><legend>Question source</legend>'+[['all','All questions'],['unseen','Not yet answered'],['missed','Missed last time'],['flagged','Flagged']].map(function(o){
      return '<label class="chk"><input type="radio" name="src" data-act="src" value="'+o[0]+'"'+(UI.src===o[0]?' checked':'')+'>'+o[1]+'</label>'; }).join('')+'</fieldset>'+
    '<fieldset><legend>Feedback</legend>'+[['study','Study: check each answer right away'],['exam','Exam: feedback at the end']].map(function(o){
      return '<label class="chk"><input type="radio" name="mode" data-act="mode" value="'+o[0]+'"'+(UI.mode===o[0]?' checked':'')+'>'+o[1]+'</label>'; }).join('')+
      '<label class="chk" style="margin-top:6px"><input type="checkbox" data-act="timed"'+(UI.timed?' checked':'')+'>Timed (1 minute per question)</label></fieldset>'+
    '<fieldset><legend>Number of questions</legend><select data-act="n">'+[10,25,50,100,'all'].map(function(n){ return '<option value="'+n+'"'+(String(UI.n)===String(n)?' selected':'')+'>'+(n==='all'?'All available':n)+'</option>'; }).join('')+'</select>'+
      '<div class="small muted" style="margin-top:6px">'+pl+' available with current filters</div></fieldset></div>';
  h += '<div class="foot"><button class="btn pri" data-act="start"'+(pl?'':' disabled')+'>Start practice'+(pl?' ('+(UI.n==='all'?pl:Math.min(+UI.n,pl))+' questions)':'')+'</button>'+
       '<span class="sp"></span><button class="btn sm ghost" data-act="resetH">Reset my history</button></div></div>';
  h += '<p class="small muted">These are original practice questions written to the 2027 ARRT content outline. They are not actual ARRT items, and their difficulty is approximate. Check anything that conflicts with your course text, NCRP/CDC/AHA guidance, or the current ARRT materials. Your progress is stored only in this browser.</p>';
  root.innerHTML=h;
}
function render(keepScroll){
  if(screen==='home') renderHome();
  else if(screen==='quiz') renderQuiz();
  else if(screen==='summary') renderSummary();
  else if(screen==='results') renderResults();
  else if(screen==='review') renderReview();
}

/* ---------- events ---------- */
root.addEventListener('click', function(e){
  var t = e.target.closest('[data-act]'); if(!t) return;
  var a = t.getAttribute('data-act');
  if(t.tagName==='INPUT'||t.tagName==='SELECT'){ if(t.getAttribute('data-act')!=='tcat'&&t.getAttribute('data-act')!=='tsub') return; }
  if(t.tagName==='INPUT' && t.closest('summary')){ e.stopPropagation(); }
  switch(a){
    case 'pick': pick(+t.getAttribute('data-oi')); break;
    case 'submit': submit(); break;
    case 'next': move(1); break;
    case 'prev': move(-1); break;
    case 'flag': toggleFlag(); break;
    case 'nav': showNav=!showNav; render(); break;
    case 'jump': jump(+t.getAttribute('data-i')); break;
    case 'firstun': for(var i=0;i<S.ids.length;i++){ if(S.ans[S.ids[i]]===undefined){ jump(i); break; } } break;
    case 'firstfl': for(var j=0;j<S.ids.length;j++){ if(S.flag[S.ids[j]]){ jump(j); break; } } break;
    case 'finish': finish(); break;
    case 'exit':
      if(S && !S.finished){ saveSession(); }
      S = S && S.finished ? null : S; if(timerId){clearInterval(timerId);timerId=null;} screen='home'; render(); break;
    case 'home': S=null; screen='home'; render(); break;
    case 'back': screen='results'; render(); break;
    case 'review': rf=t.getAttribute('data-f'); ri=0; screen='review'; render(); window.scrollTo(0,0); break;
    case 'rf': rf=t.getAttribute('data-f'); ri=0; render(); break;
    case 'rnext': ri++; render(); window.scrollTo(0,0); break;
    case 'rprev': ri--; render(); window.scrollTo(0,0); break;
    case 'rflag': var id=reviewList()[ri]; S.flag[id]=!S.flag[id]; var h2=H[id]||{n:0,c:0}; h2.flag=!!S.flag[id]; H[id]=h2; persistH(); render(); break;
    case 'missed': var ids = S.ids.filter(function(id){return S.ans[id]!==undefined && !isCorrect(id);});
      if(!ids.length){ alert_inline('No missed questions in this session.'); break; }
      S = makeSession('custom', shuffle(ids), 'study', 0); go('quiz'); break;
    case 'mock': startMock(); break;
    case 'start': startCustom(); break;
    case 'resume': S = lsGet(SK); if(S){ if(!S.flag) S.flag={}; go('quiz'); } break;
    case 'discard': lsDel(SK); render(); break;
    case 'selall': UI.sel = QS.map(function(q){return q.t;}).filter(function(v,i,a){return a.indexOf(v)===i;}); saveUI(); render(); break;
    case 'selnone': UI.sel=[]; saveUI(); render(); break;
    case 'selgroup': var g=t.getAttribute('data-g'); UI.sel=[]; CATS.forEach(function(c){ if(c.group===g) c.subs.forEach(function(s){UI.sel.push(s.k);}); }); saveUI(); render(); break;
    case 'tcat': var c=catBy[t.getAttribute('data-c')], on=t.checked; UI.sel = UI.sel.filter(function(k){return subCat[k]!==c.k;});
      if(on) c.subs.forEach(function(s){UI.sel.push(s.k);}); UI.open[c.k]=true; saveUI(); render(); break;
    case 'tsub': var k=t.getAttribute('data-s'); if(t.checked){ if(UI.sel.indexOf(k)<0) UI.sel.push(k); } else UI.sel=UI.sel.filter(function(x){return x!==k;});
      UI.open[subCat[k]]=true; saveUI(); render(); break;
    case 'src': UI.src=t.value; saveUI(); render(); break;
    case 'mode': UI.mode=t.value; saveUI(); break;
    case 'timed': UI.timed=t.checked; saveUI(); break;
    case 'resetH': if(window.__confirmReset){ H={}; persistH(); window.__confirmReset=false; render(); } else { window.__confirmReset=true; t.textContent='Click again to confirm reset'; } break;
  }
});
root.addEventListener('change', function(e){
  var t=e.target; if(t.getAttribute('data-act')==='n'){ UI.n=t.value; saveUI(); render(); }
});
root.addEventListener('toggle', function(e){
  var d=e.target; if(d.classList && d.classList.contains('cat')) UI.open[d.getAttribute('data-cat')]=d.open;
}, true);
function alert_inline(msg){ var d=document.createElement('div'); d.className='banner'; d.textContent=msg; root.prepend(d); setTimeout(function(){d.remove();},3000); }
document.addEventListener('keydown', function(e){
  if(!S || e.ctrlKey||e.metaKey||e.altKey) return;
  var tag=(e.target.tagName||'').toLowerCase(); if(tag==='select'||tag==='input'&&e.target.type!=='radio'&&e.target.type!=='checkbox') return;
  var k=e.key;
  if(screen==='quiz'){
    var id=curId(), revealed=S.mode==='study'&&S.sub[id];
    var m = {a:0,b:1,c:2,d:3,'1':0,'2':1,'3':2,'4':3}[k.toLowerCase()];
    if(m!==undefined && !revealed){ pick(S.perm[id][m]); e.preventDefault(); }
    else if(k==='Enter'){ e.preventDefault(); if(S.mode==='study'&&!revealed){ submit(); } else move(1); }
    else if(k==='ArrowRight'){ move(1); } else if(k==='ArrowLeft'){ move(-1); }
    else if(k.toLowerCase()==='f'){ toggleFlag(); }
  } else if(screen==='review'){
    if(k==='ArrowRight'){ var l=reviewList(); if(ri<l.length-1){ri++;render();window.scrollTo(0,0);} }
    else if(k==='ArrowLeft'){ if(ri>0){ri--;render();window.scrollTo(0,0);} }
  }
});
window.addEventListener('beforeunload', function(){ if(S&&!S.finished) saveSession(); });

render();
})();
</script>
