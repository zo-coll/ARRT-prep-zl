ettings."]},{"id":"ia15","c":"ia","t":"TC","q":"Which cast typically requires the greatest increase in exposure technique?","o":["Dry fiberglass cast","Dry plaster cast","Wet plaster cast","Soft padded splint"],"a":2,"e":["Fiberglass casts attenuate the least of these.","Dry plaster requires a modest increase.","Wet plaster is thick and contains water, attenuating the most, so it needs the largest increase.","Soft splints add little attenuation."]},{"id":"ia16","c":"ia","t":"TC","q":"Which AEC detector selection is most appropriate for a PA upright chest radiograph?","o":["Center detector only","The two outer (lateral) detectors over the lung fields","All three detectors including the center","No detector, using manual technique only"],"a":1,"e":["The center detector lies under the mediastinum and spine and would overexpose the lungs.","The lateral detectors lie under the lung fields, so exposure terminates when lung density is correct.","Including the center detector averages in the denser mediastinum.","AEC is commonly used for chest exams."]},{"id":"ia17","c":"ia","t":"TC","q":"A radiographer wishes to reduce receptor exposure by about 25% on an AEC exam. Which adjustment is appropriate?","o":["Increase the density control by one step","Decrease the density control by one step","Double the backup time","Switch to a larger focal spot"],"a":1,"e":["Increasing the density control raises exposure (about 25% per step).","Each density control step typically changes exposure by about 25%, so decreasing one step reduces it by about that amount.","Backup time is a safety limit and does not set the normal exposure.","Focal spot size does not control receptor exposure."]},{"id":"ia18","c":"ia","t":"DC","q":"A 35 cm square field of view is displayed with a 2048 x 2048 matrix. What is the approximate pixel size?","o":["0.085 mm","0.17 mm","0.34 mm","0.68 mm"],"a":1,"e":["This would correspond to a matrix near 4096.","Pixel size = FOV / matrix = 350 mm / 2048 = about 0.17 mm.","This would correspond to a matrix near 1024.","This would correspond to a matrix near 512."]},{"id":"ia19","c":"ia","t":"DC","q":"A digital detector has a pixel pitch of 0.1 mm. What is its Nyquist frequency?","o":["2 lp/mm","5 lp/mm","10 lp/mm","20 lp/mm"],"a":1,"e":["This would require a pixel pitch of 0.25 mm.","Nyquist frequency = 1 / (2 x pixel pitch) = 1 / 0.2 mm = 5 lp/mm.","This omits the factor of 2 in the denominator.","This would require a pixel pitch of 0.025 mm."]},{"id":"ia20","c":"ia","t":"DC","q":"An image is stored with a 12-bit depth. How many shades of gray can be represented?","o":["256","1024","4096","16384"],"a":2,"e":["256 corresponds to 8 bits.","1024 corresponds to 10 bits.","2^12 = 4096 gray levels.","16384 corresponds to 14 bits."]},{"id":"ia21","c":"ia","t":"DC","q":"The fill factor of a detector element (DEL) is the:","o":["Ratio of the radiosensitive area to the total area of the DEL","Total number of DELs across the detector","Time needed to read out the detector","Size of the pixel on the display monitor"],"a":0,"e":["Fill factor is the fraction of the DEL area that is active (sensing) versus occupied by electronics. A higher fill factor improves dose efficiency and SNR.","Number of DELs relates to matrix size.","Readout time is a different performance parameter.","Display pixel size depends on the monitor."]},{"id":"ia22","c":"ia","t":"DC","q":"Which change would improve the signal-to-noise ratio (SNR) of a digital image?","o":["Decreasing mAs","Increasing the number of photons reaching the detector (increasing mAs)","Using a lower DQE detector","Increasing the OID without compensation"],"a":1,"e":["Lower mAs reduces photons and increases quantum noise.","More photons reduce quantum mottle relative to the signal, increasing SNR, though at higher dose.","A lower DQE detector uses photons less efficiently, so SNR falls.","A larger OID with no adjustment reduces scatter reaching the receptor only in the air-gap sense and does not generally improve SNR."]},{"id":"ia23","c":"ia","t":"DC","q":"Compared with film-screen systems, the wider dynamic range of digital receptors results in:","o":["A narrower range of exposures that produce acceptable images","A greater range of exposures that can produce an acceptable image","Fixed contrast that cannot be changed","Elimination of quantum noise"],"a":1,"e":["Wider dynamic range means more latitude, not less.","Digital detectors respond across a large exposure range, so acceptable images can result despite exposure errors, making exposure indicators essential.","Digital contrast can be adjusted with postprocessing.","Quantum noise persists, especially with low exposure."]},{"id":"ia24","c":"ia","t":"DC","q":"Which statement correctly describes the modulation transfer function (MTF)?","o":["A higher MTF at a given spatial frequency indicates better spatial resolution","MTF measures the contrast resolution of the display monitor only","A lower MTF indicates a better detector","MTF is independent of spatial frequency"],"a":0,"e":["MTF describes how faithfully the system transfers contrast at each spatial frequency. Higher MTF means better resolution.","MTF is used for system or detector spatial resolution.","A lower MTF means more signal is lost.","MTF is plotted as a function of spatial frequency."]},{"id":"ia25","c":"ia","t":"IE","q":"A deviation index (DI) of +3 indicates that the receptor exposure was approximately:","o":["Half of the target exposure","Equal to the target exposure","Twice the target exposure","Ten times the target exposure"],"a":2,"e":["A DI of -3 corresponds to about half of the target exposure.","A DI of 0 indicates exposure equal to the target.","DI = 10 x log (EI / EI target), so +3 corresponds to a factor of about 2 (100% overexposure).","A tenfold increase would be a DI of +10."]},{"id":"ia26","c":"ia","t":"IE","q":"A digital radiograph appears grainy with a mottled texture. What is the most likely cause?","o":["Excessive mAs producing saturation of the detector","Insufficient exposure to the receptor (quantum noise)","Grid cutoff from an off-level grid","Excessive OID increasing penumbra"],"a":1,"e":["Excess mAs produces overexposure and possible saturation, not mottle.","Too few photons reaching the detector produce quantum noise (mottle), seen as graininess.","Grid cutoff causes loss of density, not necessarily a grainy texture, though underexposure may follow.","OID affects magnification and blur."]},{"id":"ia27","c":"ia","t":"IE","q":"A moire (zebra) pattern appears on an image acquired with a stationary grid on a digital system. What is the likely cause?","o":["Aliasing from grid line frequency near the detector sampling frequency","Insufficient kVp for the part thickness","Backscatter from the table behind the receptor","Excessive patient motion during the exposure"],"a":0,"e":["When grid line frequency approaches the sampling (Nyquist) frequency, aliasing produces a moire pattern.","kVp errors affect contrast and penetration, not patterned artifacts.","Backscatter can cause fog or image of table structures, not a regular pattern.","Motion causes blur."]},{"id":"ia28","c":"ia","t":"IE","q":"What is the best practice for anatomic side markers on a radiograph?","o":["Place the marker in the beam at exposure, off the anatomy of interest","Add the marker electronically after the exam is processed","Omit the marker if the radiographer remembers the side","Write the side on the requisition only"],"a":0,"e":["The lead marker should be visible within the collimated field at exposure, serving as a legal and diagnostic record.","Post-exposure annotation can conceal errors or mislabeling and is not the preferred method.","Memory is not a legally acceptable identifier.","The side must be on the image itself."]},{"id":"ia29","c":"ia","t":"IE","q":"What does detector saturation from gross overexposure mean for the image?","o":["Information in the overexposed areas is lost and cannot be recovered by postprocessing","The image can always be corrected with window level adjustment","Only noise is affected","It increases spatial resolution"],"a":0,"e":["When the detector's response exceeds its range, data are lost (burnout), so postprocessing cannot recover it.","Postprocessing manipulates existing data and cannot recreate missing information.","Saturation causes loss of contrast detail, not just noise.","Spatial resolution is not improved by overexposure."]},{"id":"ia30","c":"ia","t":"IE","q":"Edge unsharpness is seen on a hand radiograph taken with a large focal spot and the hand elevated 10 inches above the receptor. What is the most likely cause?","o":["Quantum noise from insufficient exposure","Geometric blur (penumbra) from the large focal spot and increased OID","Grid cutoff from an off-center grid","Insufficient kVp for the hand"],"a":1,"e":["Quantum noise appears as graininess, not edge blur.","Large focal spot size and long OID both increase penumbra and magnification, degrading sharpness.","A grid is generally not used on the hand and cutoff does not cause edge blur.","kVp affects contrast and penetration, not sharpness."]},{"id":"eq1","c":"eq","t":"EQ","q":"Which component of the x-ray circuit increases the voltage supplied by the autotransformer to the kilovolt range required across the x-ray tube?","o":["Step-down transformer, which lowers voltage and raises current","Step-up (high-voltage) transformer","Rectifier, which converts alternating current to pulsating direct current","Filament transformer, which supplies heating current to the cathode"],"a":1,"e":["A step-down transformer lowers voltage and raises current. It supplies the filament circuit.","The step-up transformer raises voltage from the volt range to the kilovolt range, with a corresponding decrease in current, per the law of transformers.","Rectifiers convert alternating current to direct (pulsating) current. They do not change voltage magnitude.","The filament transformer is a step-down device that heats the filament."]},{"id":"eq2","c":"eq","t":"EQ","q":"Which type of generator produces the least voltage ripple and the highest average x-ray energy for a given kVp?","o":["Single-phase, full-wave rectified","Three-phase, six-pulse","Three-phase, twelve-pulse","High-frequency"],"a":3,"e":["Single-phase full-wave has 100% ripple, giving the lowest average photon energy.","Three-phase six-pulse has about 13% ripple.","Three-phase twelve-pulse has about 3.5% ripple, which is better than six-pulse but still more than high-frequency.","High-frequency generators have less than 1% ripple, producing nearly constant potential, the highest average energy, and the most efficient x-ray output."]},{"id":"eq3","c":"eq","t":"EQ","q":"Tungsten is the preferred target material for general radiography primarily because it has:","o":["A low atomic number and low melting point","A high atomic number and a high melting point","A low atomic number and high melting point","A high atomic number and low melting point"],"a":1,"e":["Low Z and a low melting point would produce fewer x-rays and cannot tolerate the heat.","Tungsten (Z = 74) efficiently produces x-rays, and its melting point of about 3400 C tolerates anode heating.","Low Z reduces x-ray production efficiency.","A low melting point would cause the target to pit or melt under load."]},{"id":"eq4","c":"eq","t":"EQ","q":"In an induction motor that rotates the anode, which part is located outside the glass or metal envelope?","o":["Rotor","Stator","Anode disk","Cathode filament"],"a":1,"e":["The rotor is inside the vacuum envelope, attached to the anode.","The stator electromagnets are outside the envelope. They induce a magnetic field that spins the rotor.","The anode disk is inside the vacuum envelope.","The filament is part of the cathode assembly inside the envelope."]},{"id":"eq5","c":"eq","t":"EQ","q":"Decreasing the target (anode) angle has which effect?","o":["Larger effective focal spot and a smaller anode heel effect","Smaller effective focal spot, greater anode heel effect, and reduced field coverage","No change in focal spot size","Larger actual focal spot and improved heat capacity"],"a":1,"e":["This reverses the effects.","By the line-focus principle, a smaller target angle gives a smaller effective focal spot, but increases the heel effect and limits the field size at a given SID.","Effective focal spot size depends directly on target angle.","The actual focal spot is the area of electron impact, which does not change with angle."]},{"id":"eq6","c":"eq","t":"EQ","q":"An exposure is made at 80 kVp, 200 mA, and 0.1 second with a single-phase generator. How many heat units are produced?","o":["800 HU","1600 HU","2160 HU","16000 HU"],"a":1,"e":["This omits the mA or the time factor.","HU = kVp x mA x time x generator factor = 80 x 200 x 0.1 x 1.0 = 1600 HU.","This applies the 1.35 factor for three-phase six-pulse, which does not apply to single-phase.","This is a decimal place error."]},{"id":"eq7","c":"eq","t":"EQ","q":"What is the purpose of the backup timer in an automatic exposure control (AEC) system?","o":["To set the desired image density for each exposure","To end the exposure if the AEC detector fails to do so","To control the kVp delivered to the tube","To increase the response time of the detectors"],"a":1,"e":["Density is set by the density control and detector response, not the backup timer.","The backup timer is a safety feature that ends the exposure at a preset limit, protecting the patient and tube from overexposure if the AEC fails.","kVp is selected manually or by APR.","The backup timer is not related to response time."]},{"id":"eq8","c":"eq","t":"EQ","q":"Which describes a direct-conversion digital radiography detector?","o":["A scintillator converts x-rays to light, which a photodiode converts to charge","An amorphous selenium photoconductor converts x-ray photons directly to electrical charge","A photostimulable phosphor stores a latent image that is read by laser","A charge-coupled device is coupled to an intensifying screen"],"a":1,"e":["This describes an indirect-conversion detector (for example, CsI with amorphous silicon).","Direct conversion uses a-Se, which converts x-rays directly to electrons without an intermediate light step, avoiding light spread.","This describes computed radiography with a cassette-based storage phosphor.","CCDs are used with scintillators for indirect conversion."]},{"id":"eq9","c":"eq","t":"EQ","q":"An image intensifier has a minification gain of 81 and a flux gain of 50. What is its brightness gain?","o":["131","1,620","4,050","40,500"],"a":2,"e":["This adds the two gains rather than multiplying.","This multiplies 81 by 20 rather than 50.","Brightness gain = minification gain x flux gain = 81 x 50 = 4,050.","This is a decimal error."]},{"id":"eq10","c":"eq","t":"EQ","q":"Which image characteristic is associated with image intensifiers but not with flat-panel fluoroscopic detectors?","o":["Pincushion distortion and vignetting","Higher detective quantum efficiency (DQE)","Digital readout of the image signal","Compatibility with a dose-area product meter"],"a":0,"e":["Image intensifiers have a curved input phosphor and electron optics that cause geometric distortion and brightness fall-off at the periphery, which flat panels do not.","Flat panels often have higher DQE, which is an advantage of the flat panel.","Digital readout applies to flat panels and to digitized II systems.","DAP meters can be used with either system."]},{"id":"eq11","c":"eq","t":"EQ","q":"In fluoroscopy, as the C-arm is moved to view a thicker part of the patient, the automatic brightness control (ABC) will most likely:","o":["Decrease mA and kVp to lower the dose rate as the part thickens","Increase mA and/or kVp to hold brightness","Remain unchanged, since brightness is set only by the operator","Terminate the exposure once the thicker region is reached"],"a":1,"e":["Thicker anatomy absorbs more radiation, so lowering factors would dim the image.","ABC increases technique to maintain consistent image brightness, which also raises the patient dose rate.","ABC exists to adjust techniques automatically.","ABC does not terminate exposures."]},{"id":"eq12","c":"eq","t":"EQ","q":"The purpose of a reciprocating Bucky mechanism is to:","o":["Increase scatter reaching the receptor through the grid","Move the grid during exposure so grid lines are blurred","Collimate the beam to the size of the receptor","Rotate the anode during the exposure"],"a":1,"e":["Grids reduce scatter, they do not increase it.","The Bucky moves the grid back and forth during the exposure, blurring the grid lines.","Collimators restrict the field, not Buckys.","The anode is rotated by the induction motor."]},{"id":"eq13","c":"eq","t":"PD","q":"Which device converts the analog electrical signal from a digital detector into a digital signal?","o":["Analog-to-digital converter (ADC)","Look-up table","Histogram","Automatic exposure controller"],"a":0,"e":["The ADC samples and quantizes the analog signal into discrete digital values.","A LUT changes how digital values are displayed and does not convert signals.","A histogram graphs the distribution of pixel values.","AEC terminates exposure and does not convert signals."]},{"id":"eq14","c":"eq","t":"PD","q":"A large lead shield is placed within the collimated field of a digital radiograph. What is the likely consequence?","o":["Histogram misanalysis, causing incorrect brightness and exposure indicator","Improved image contrast because the shield absorbs scatter","Grid cutoff caused by the lead content of the shield","Decreased quantum noise because fewer photons reach the detector"],"a":0,"e":["Highly attenuating objects in the field alter the histogram, so the system may pick the wrong values of interest, resulting in brightness errors and misleading exposure indicators.","Rescaling errors typically degrade rather than improve image quality.","Grid cutoff relates to grid alignment, not shielding.","Noise is related to photon count, not shield placement."]},{"id":"eq15","c":"eq","t":"PD","q":"A look-up table (LUT) in digital imaging is used to:","o":["Store patient demographics and exam identifiers in the DICOM header","Map pixel values to displayed gray levels (brightness and contrast)","Calibrate the x-ray tube output across the kVp stations","Select the detector size and matrix for the examination"],"a":1,"e":["Demographics are stored in the RIS or DICOM headers.","The LUT assigns an output gray value to each input pixel value, controlling how the image is presented.","Tube calibration is a QC procedure.","Detector selection is a technique choice."]},{"id":"eq16","c":"eq","t":"PD","q":"To increase the displayed contrast of a digital image during postprocessing, the radiographer should:","o":["Increase the window level","Narrow the window width","Widen the window width","Decrease the window level"],"a":1,"e":["Window level controls brightness, not contrast.","A narrower window width spreads fewer pixel values over the full gray scale, increasing contrast.","A wider window displays more values with smaller differences, decreasing contrast.","Window level alters overall brightness."]},{"id":"eq17","c":"eq","t":"PD","q":"Which image processing function reduces noise but also reduces sharpness?","o":["Edge enhancement","Smoothing","Equalization","Stitching"],"a":1,"e":["Edge enhancement emphasizes boundaries and also amplifies noise.","Smoothing uses a low-pass filter to blend neighboring pixels, reducing noise at a cost to detail.","Equalization adjusts contrast to reduce differences between light and dark regions.","Stitching combines multiple images into one long image."]},{"id":"eq18","c":"eq","t":"PD","q":"Image stitching is most commonly used to:","o":["Reduce patient dose by averaging repeated exposures","Join sequential images into one long image, such as for scoliosis","Reduce quantum noise by summing multiple images","Correct for grid cutoff across the receptor"],"a":1,"e":["Stitching does not alter patient dose.","Stitching joins sequential images to cover anatomy that exceeds a single detector's size.","Noise is addressed by exposure or smoothing.","Grid cutoff is a positioning issue."]},{"id":"eq19","c":"eq","t":"PD","q":"Which environment best supports accurate viewing of images on a diagnostic display monitor?","o":["Bright ambient light and viewing from a steep angle","Low ambient lighting and viewing perpendicular to the screen","Bright light behind the monitor","Window light shining on the screen"],"a":1,"e":["Bright light and steep viewing angles reduce perceived contrast.","Low ambient lighting and on-axis viewing preserve contrast, particularly for LCD monitors.","Backlighting causes glare.","Reflections reduce visible contrast."]},{"id":"eq20","c":"eq","t":"PD","q":"The DICOM standard is designed to:","o":["Reduce patient dose across different modalities","Allow imaging devices to exchange images and related information","Schedule patient appointments within the radiology department","Store only text-based radiology reports in the EMR"],"a":1,"e":["DICOM does not regulate dose, though it can carry dose information.","DICOM defines formats and communication protocols so modalities, PACS, and workstations can exchange images and patient data.","Scheduling is mainly a RIS function.","DICOM handles images and associated data."]},{"id":"eq21","c":"eq","t":"PD","q":"Which information system is primarily responsible for radiology order entry, scheduling, and report management?","o":["PACS","RIS","Image intensifier","DAP meter"],"a":1,"e":["PACS stores, transmits, and displays images.","The radiology information system manages orders, scheduling, tracking, and reporting for the radiology department.","An image intensifier is fluoroscopy hardware.","A DAP meter measures dose."]},{"id":"eq22","c":"eq","t":"QC","q":"At a 100 cm SID, the maximum acceptable misalignment between the light field and the radiation field is:","o":["0.5 cm","1 cm","2 cm","5 cm"],"a":2,"e":["This is tighter than the standard tolerance.","This is tighter than the 2% standard.","The accepted tolerance is 2% of SID, so at 100 cm the edges may differ by up to 2 cm.","This exceeds the allowable tolerance."]},{"id":"eq23","c":"eq","t":"QC","q":"The central ray alignment of an x-ray tube should be within what tolerance of perpendicular?","o":["1 degree","5 degrees","10 degrees","15 degrees"],"a":0,"e":["Central ray alignment is expected to be within about 1 degree of perpendicular to the receptor.","5 degrees would cause noticeable distortion and grid cutoff.","10 degrees is far too much.","15 degrees is far too much."]},{"id":"eq24","c":"eq","t":"QC","q":"Flat-field (gain and offset) calibration of a digital detector is performed to:","o":["Verify the kVp accuracy of the x-ray generator","Correct pixel-to-pixel variations in detector response","Reduce patient dose by increasing detector efficiency","Calibrate the collimator light field to the radiation field"],"a":1,"e":["kVp accuracy is verified by separate generator testing.","A uniform exposure is used to map and correct nonuniform response across the detector.","Calibration maintains image uniformity but does not change dose.","Collimator accuracy is tested separately."]},{"id":"eq25","c":"eq","t":"QC","q":"The Grayscale Standard Display Function (GSDF) is used to:","o":["Make gray levels look perceptually consistent across monitors","Measure patient exposure at the detector","Set the focal spot size for fine-detail exams","Define the matrix size of the displayed image"],"a":0,"e":["GSDF is a DICOM standard that makes gray-level steps look uniform to the human eye, so images appear the same on different displays.","Patient exposure is measured with dose indicators or meters.","Focal spot size is a tube parameter.","Matrix size describes the number of pixels."]},{"id":"eq26","c":"eq","t":"QC","q":"Lead aprons should be evaluated for cracks and holes by:","o":["Visual inspection only, once every five years","Visual and tactile inspection plus imaging, at least annually","Weighing the apron to see if lead has been lost","Folding it at the creases to check its flexibility"],"a":1,"e":["Five years is too infrequent for devices that crack under use.","Routine inspection, with imaging when needed, detects defects that reduce protection, and should be done at least annually.","Weight does not indicate integrity of the lead layer.","Folding damages the apron."]},{"id":"eq27","c":"eq","t":"QC","q":"A mobile x-ray unit's collimator light field no longer matches the radiation field. What is the appropriate action?","o":["Continue using the unit and compensate by overcollimating","Remove the unit from service and report the problem according to policy","Increase the mAs","Ignore it if images look acceptable"],"a":1,"e":["Misalignment can lead to repeats or irradiating the wrong area, and it is a defect that needs repair.","Equipment that fails QC is reported to the appropriate personnel and removed from use until corrected.","Increasing mAs does not fix alignment and raises dose.","Unacceptable alignment risks misdiagnosis and unnecessary exposure."]},{"id":"eq28","c":"eq","t":"QC","q":"Computed radiography imaging plates that have not been used for an extended period should be:","o":["Used immediately without any special preparation","Erased before use to remove background signal","Discarded because stored plates cannot be reused","Exposed to a high-kVp field to reset them"],"a":1,"e":["Stored plates accumulate background signal that can add fog or artifacts.","Plates left unused (for example, more than 24 to 48 hours) should be erased per manufacturer instruction before reuse.","Plates are reusable and do not need to be discarded for this reason.","Exposing plates in this way does not erase them properly."]},{"id":"hsp1","c":"hsp","t":"HD","q":"For an AP axial (Towne) projection of the skull, the central ray is directed:","o":["15 degrees caudad to the orbitomeatal line (OML)","30 degrees caudad to the OML","15 degrees cephalad to the OML","Perpendicular to the OML"],"a":1,"e":["15 degrees caudad is used for the PA axial (Caldwell) projection.","The Towne projection uses a 30-degree caudad angle to the OML (37 degrees to the infraorbitomeatal line) to project the occipital bone and dorsum sellae within the foramen magnum.","A cephalad angle would project the structures in the wrong direction.","A perpendicular CR would project the petrous ridges and occipital bone onto the facial structures instead of showing the occipital bone."]},{"id":"hsp2","c":"hsp","t":"HD","q":"On a correctly positioned PA axial (Caldwell) projection for the skull or facial bones, the petrous ridges are located:","o":["Below the maxillary sinuses","In the lower third of the orbits","Above the orbits","Superimposed on the mandible"],"a":1,"e":["Petrous ridges project below the maxillary sinuses on a Waters projection, not a Caldwell.","With the CR angled 15 degrees caudad, the petrous ridges fill the lower third of the orbits.","The ridges do not project above the orbits in a correct Caldwell.","The mandible is not superimposed by the petrous ridges in this view."]},{"id":"hsp3","c":"hsp","t":"HD","q":"On a Waters (parietoacanthial) projection, which finding confirms correct positioning of the head?","o":["Petrous ridges projected below the maxillary sinuses","Petrous ridges projected within the orbits","Petrous ridges superimposed on the nasal bones","The mandible is not visible"],"a":0,"e":["With the OML at about 37 degrees to the IR and the chin raised, the petrous pyramids project inferior to the maxillary sinuses.","Petrous ridges in the orbits are characteristic of a Caldwell projection.","Petrous ridges do not project onto the nasal bones in the Waters projection.","The mandible visibility is not the evaluation criterion for correct extension."]},{"id":"hsp4","c":"hsp","t":"HD","q":"A Waters projection shows the petrous ridges projected over the lower maxillary sinuses. What correction is needed?","o":["Increase extension of the neck (raise the chin)","Decrease extension (lower the chin)","Angle the CR cephalad","Rotate the head toward the left"],"a":0,"e":["Insufficient extension leaves the petrous ridges over the sinuses. Raising the chin further moves them below the sinuses.","Lowering the chin would move the ridges even higher on the sinuses.","The CR is perpendicular for a Waters projection, so angulation is not the correction.","Rotation would produce asymmetry rather than shifting the petrous ridges vertically."]},{"id":"hsp5","c":"hsp","t":"HD","q":"For a submentovertex (SMV) skull projection, the patient's head is positioned so that the:","o":["Infraorbitomeatal line (IOML) is parallel to the IR","OML is perpendicular to the IR","Midsagittal plane is parallel to the IR","Acanthiomeatal line is vertical"],"a":0,"e":["For SMV the neck is hyperextended so the IOML is parallel to the IR, with the CR perpendicular to the IOML.","An OML perpendicular to the IR describes a PA (Caldwell-type) positioning, not SMV.","The midsagittal plane is perpendicular to the IR for SMV, aligned with the center of the IR.","This line is used for Waters positioning, not for SMV."]},{"id":"hsp6","c":"hsp","t":"HD","q":"Why is a horizontal-beam (cross-table) lateral skull obtained for a supine trauma patient?","o":["To show air-fluid levels in the sphenoid sinus without moving the patient","To improve soft tissue contrast in the scalp","To reduce the patient's radiation dose","To eliminate the need for a grid"],"a":0,"e":["A horizontal beam shows air-fluid levels, which can indicate a basilar skull fracture, and the head need not be moved.","The horizontal beam is chosen for fluid levels and safety, not soft tissue contrast.","Dose is not the main reason.","Grid use depends on thickness and technique, and is not eliminated by a horizontal beam."]},{"id":"hsp7","c":"hsp","t":"HD","q":"Temporomandibular joint (TMJ) imaging often includes both open-mouth and closed-mouth projections in order to:","o":["Reduce patient dose","Evaluate condylar movement and joint position","Demonstrate the paranasal sinuses","Eliminate the need for a grid"],"a":1,"e":["Dose is not reduced by performing both views.","Comparing open and closed positions shows how far the condyle translates and whether the joint moves normally.","The sinuses are not the target of TMJ views.","Grid use is unrelated to the open and closed comparison."]},{"id":"hsp8","c":"hsp","t":"HD","q":"A patient with a history of a metallic fragment in the eye is scheduled for an MRI of the brain. What is the appropriate action?","o":["Proceed with the MRI as ordered","Screen with orbit radiographs or CT for retained metal before MRI","Skip screening if the patient reports no pain","Perform the MRI with the patient's eyes closed"],"a":1,"e":["Metal in the orbit could move in the magnetic field and cause blindness.","Screening orbit images identify metallic foreign bodies, and the radiologist decides if MRI is safe.","Absence of pain does not rule out a retained fragment.","Eye closure offers no protection."]},{"id":"hsp9","c":"hsp","t":"SP","q":"For an AP axial projection of the cervical spine, the central ray is directed:","o":["15 to 20 degrees cephalad","15 to 20 degrees caudad","Perpendicular","30 degrees cephalad"],"a":0,"e":["The cephalad angle opens the intervertebral disk spaces and compensates for the cervical lordotic curve.","A caudad angle would worsen disk space overlap.","A perpendicular CR does not align with the disk spaces in the normal lordosis.","30 degrees exceeds the standard angle."]},{"id":"hsp10","c":"hsp","t":"SP","q":"An AP open-mouth projection of the cervical spine is performed to demonstrate:","o":["The C5-C6 intervertebral disk space","The dens and the lateral masses of C1","The spinous processes of C4-C7","The intervertebral foramina"],"a":1,"e":["Disk spaces of the lower cervical spine are shown on the AP axial.","The open-mouth view projects the dens and C1-C2 articulation through the open mouth.","Spinous processes are shown on the lateral view.","Foramina are shown on oblique projections."]},{"id":"hsp11","c":"hsp","t":"SP","q":"A 72-inch SID is commonly used for a lateral cervical spine radiograph in order to:","o":["Increase the dose to the thyroid gland","Reduce magnification caused by the increased OID of the cervical spine","Increase scatter reaching the receptor","Reduce the need for a grid in a thick neck"],"a":1,"e":["The long SID reduces divergence and lowers dose to superficial tissues, so it does not increase thyroid dose.","The cervical spine is relatively far from the receptor at the shoulders, so a long SID limits magnification and improves detail.","Increasing SID reduces scatter reaching the receptor with an air gap, it does not increase it.","Grids are used according to part thickness and technique."]},{"id":"hsp12","c":"hsp","t":"SP","q":"On a cross-table lateral cervical spine of a trauma patient, C7-T1 is not visualized because of the shoulders. What is the best next step?","o":["Forcefully pull down on the patient's arms","Obtain a swimmer's (Twining) lateral","Remove the cervical collar","Repeat the exam with greater mAs only"],"a":1,"e":["Pulling the shoulders in a trauma patient before cleared can worsen an unstable cervical injury.","The swimmer's lateral, with one arm raised and one lowered, projects the cervicothoracic junction without moving the neck.","The collar and spine should remain immobilized until cleared by a physician.","More mAs does not change the shoulder superimposition."]},{"id":"hsp13","c":"hsp","t":"SP","q":"In an RPO (AP oblique) cervical spine projection, which intervertebral foramina are demonstrated?","o":["The right foramina, closest to the IR","The left foramina, farthest from the IR","Both sides equally","None, only the disk spaces"],"a":1,"e":["In AP obliques the foramina farther from the IR are shown. The right side is closest to the IR in an RPO.","In AP obliques (RPO, LPO) the foramina of the side farthest from the IR are demonstrated, so an RPO shows the left foramina. In PA obliques the side closest to the IR is shown.","Only one side is optimized per oblique, so both oblique positions are needed to see both sides.","The intervertebral foramina are the target of the oblique views."]},{"id":"hsp14","c":"hsp","t":"SP","q":"Lateral flexion and extension projections of the cervical spine are performed to evaluate:","o":["Fracture alignment in the acutely injured patient","Spinal stability and range of motion, after fracture is excluded","The thyroid gland and surrounding soft tissue","Lung expansion at the apices"],"a":1,"e":["Moving a patient with a suspected fracture is unsafe, so these are not part of acute trauma screening.","Flexion and extension views assess ligamentous stability and motion, typically after bony injury is excluded and with physician direction.","Thyroid evaluation is not the purpose of the view.","Lung expansion is evaluated with chest imaging."]},{"id":"hsp15","c":"hsp","t":"SP","q":"A lateral thoracic spine radiograph is often taken using a breathing technique with a long exposure time. What is the purpose?","o":["To increase contrast between bone and soft tissue","To blur lung markings and ribs that overlie the vertebrae","To reduce patient dose","To increase magnification"],"a":1,"e":["Breathing technique does not primarily alter subject contrast.","Controlled shallow breathing during a longer low-mA exposure blurs overlying ribs and lung markings and improves visibility of the vertebrae.","The longer exposure does not reduce dose.","Magnification is determined by OID and SID."]},{"id":"hsp16","c":"hsp","t":"SP","q":"A PA projection is preferred for a scoliosis series primarily because it:","o":["Increases magnification of the thoracic spine","Reduces dose to radiosensitive tissue such as the breasts and thyroid","Improves visualization of the lung fields","Eliminates the need for a grid in the exam"],"a":1,"e":["PA positioning does not magnify the spine more.","Because the beam enters posteriorly and exits anteriorly, dose to anterior radiosensitive tissue like breasts is reduced, which matters for the many young patients with scoliosis.","Lung visualization is not the goal.","Grid use depends on thickness and kVp."]},{"id":"hsp17","c":"hsp","t":"SP","q":"On an oblique lumbar spine projection, the 'neck' of the Scotty dog is formed by the:","o":["Transverse process","Pars interarticularis","Pedicle","Inferior articular process"],"a":1,"e":["The transverse process forms the dog's nose.","The pars interarticularis forms the neck, and a break there (spondylolysis) appears as a collar on the dog.","The pedicle forms the eye.","The inferior articular process forms the front leg."]},{"id":"hsp18","c":"hsp","t":"SP","q":"A radiolucent pad is placed under the waist of a patient in the lateral position for a lateral lumbar spine. Why?","o":["To reduce dose to the gonadal region","To keep the spine parallel to the table and open the disk spaces","To increase the OID and decrease scatter","To avoid using a grid on a thick patient"],"a":1,"e":["The pad does not reduce dose.","In a broad-hipped or slender patient the spine sags toward the table, and the pad keeps it parallel so disk spaces are not obliqued.","The goal is not to increase OID.","A pad has no effect on grid need."]},{"id":"hsp19","c":"hsp","t":"SP","q":"For AP axial projections of the sacrum and coccyx respectively, the CR angles are:","o":["15 degrees cephalad and 10 degrees caudad","15 degrees caudad and 10 degrees cephalad","30 degrees cephalad and 30 degrees caudad","Both perpendicular"],"a":0,"e":["The sacrum slopes posteriorly, so a 15-degree cephalad angle is used, while the coccyx curves anteriorly and needs a 10-degree caudad angle.","This reverses the angulation directions.","30 degrees is too steep and is closer to the SI joint or L5-S1 angles.","The curvature of both structures requires angulation."]},{"id":"hsp20","c":"hsp","t":"SP","q":"For an AP axial projection to demonstrate the sacroiliac joints, the CR is angled approximately:","o":["10 degrees caudad","15 degrees cephalad","30 to 35 degrees cephalad","45 degrees caudad"],"a":2,"e":["A caudad angle would project the joints incorrectly.","15 degrees is used for the sacrum.","A 30 to 35 degree cephalad angle projects the SI joints so they are seen in profile, with the greater angle often used for females.","45 degrees caudad is not used for this view."]},{"id":"hsp21","c":"hsp","t":"SP","q":"For a routine AP pelvis, the lower limbs are internally rotated 15 to 20 degrees to:","o":["Reduce dose to the gonads in the primary beam","Place the femoral necks parallel to the IR, avoiding foreshortening","Demonstrate the acetabulum in profile","Reduce scatter reaching the receptor"],"a":1,"e":["Rotation does not reduce dose.","Internal rotation aligns the femoral necks parallel to the IR. This rotation is not performed when a fracture or dislocation is suspected.","The acetabulum is evaluated with oblique (Judet) views.","Rotation does not reduce scatter."]},{"id":"hsp22","c":"hsp","t":"SP","q":"Which projection is appropriate for a lateral view of the hip in a patient with a suspected hip fracture who cannot move the injured leg?","o":["Unilateral frog-leg lateral with the knee flexed","Axiolateral inferosuperior (Danelius-Miller), horizontal beam","Upright lateral with the patient standing","Prone lateral with the patient turned on the stomach"],"a":1,"e":["The frog-leg requires abduction and rotation of the injured limb, which could displace a fracture.","The cross-table axiolateral projection images the hip laterally without moving the injured limb.","An upright lateral would require weight bearing, which is unsafe.","Prone positioning requires moving the patient."]},{"id":"hsp23","c":"hsp","t":"SP","q":"Which statement about a frog-leg lateral hip projection is correct?","o":["It is the preferred projection for suspected acute hip fracture","It should not be performed when a fracture or hip prosthesis is suspected","It uses a perpendicular CR through the knee","It requires internal rotation of 45 degrees"],"a":1,"e":["The frog-leg is a non-trauma projection.","Abducting the limb can displace a fracture or dislocate a prosthesis, so use a cross-table lateral instead.","The CR is directed to the femoral neck, not the knee.","It uses abduction with knee flexion, not internal rotation."]},{"id":"hsp24","c":"hsp","t":"SP","q":"Which type of contrast is used for myelography?","o":["Barium sulfate suspension of thin consistency","Water-soluble, non-ionic iodinated contrast approved for intrathecal use","Ionic iodinated contrast formulated for intravenous use","Air only, introduced into the subarachnoid space"],"a":1,"e":["Barium is not injected into the spinal canal.","Non-ionic, low-osmolar water-soluble contrast is injected into the subarachnoid space and is safe for intrathecal use.","Ionic contrast is neurotoxic if injected intrathecally.","Air is not used as the contrast for a standard myelogram."]},{"id":"ta1","c":"ta","t":"TH","q":"A 72-inch SID is used for an upright PA chest radiograph primarily to:","o":["Increase the dose to the lungs","Reduce magnification of the heart","Increase scatter","Reduce the need for breath holding"],"a":1,"e":["A long SID reduces skin dose and does not increase lung dose.","The heart lies relatively far from the receptor in a PA projection, and the long SID decreases magnification and improves spatial detail.","A longer SID reduces, not increases, scatter reaching the receptor with an air gap.","Breath-holding is required regardless of SID."]},{"id":"ta2","c":"ta","t":"TH","q":"Why is a left lateral chest projection preferred over a right lateral for routine imaging?","o":["It keeps the heart nearer the IR, reducing cardiac magnification","It keeps the liver closer to the IR","It eliminates the need for a grid","It increases the lung volume demonstrated"],"a":0,"e":["The heart lies left of midline, so left side against the IR keeps it nearer the receptor and reduces magnification.","The liver position is not the reason for choosing the left lateral.","Chest exams commonly use a grid based on part thickness.","Lung volume depends on inspiration, not side."]},{"id":"ta3","c":"ta","t":"TH","q":"An AP lordotic chest projection is performed primarily to demonstrate:","o":["The heart size and cardiac borders","The lung apices, free of overlying clavicles","The costophrenic angles and diaphragm","The sternum free of the spine"],"a":1,"e":["Heart size is evaluated on PA chest views.","Leaning back (or angling the CR 15 to 20 degrees cephalad) projects the clavicles above the apices so they are seen clearly.","Costophrenic angles are shown on routine PA and lateral views.","The sternum is imaged using RAO or lateral projections."]},{"id":"ta4","c":"ta","t":"TH","q":"A patient is suspected of having a pleural effusion. For a lateral decubitus chest radiograph with a horizontal beam, which side should be down?","o":["The unaffected side","The affected side","Either side, it makes no difference","The patient should be prone"],"a":1,"e":["With the unaffected side down, fluid layers away from the lung being evaluated and may not be seen.","Fluid layers in the dependent portion, so placing the affected side down shows a layer along the lateral chest wall.","The side matters because gravity determines where fluid collects.","A decubitus position is on the side with a horizontal beam, not prone."]},{"id":"ta5","c":"ta","t":"TH","q":"Which respiratory phase is best for demonstrating a small pneumothorax on an upright chest radiograph?","o":["Full inspiration","Expiration","Normal breathing during exposure","Valsalva maneuver"],"a":1,"e":["On inspiration the lung expands and the pleural air space is less conspicuous.","On expiration the lung volume decreases while the amount of free air stays the same, making the air in the pleural space more apparent.","Normal breathing blurs detail.","Valsalva is not used for chest radiography."]},{"id":"ta6","c":"ta","t":"TH","q":"Ribs located above the diaphragm are best demonstrated using which respiratory technique?","o":["Suspended expiration","Suspended inspiration","Shallow breathing","No breath holding"],"a":1,"e":["Expiration raises the diaphragm and is used for ribs below the diaphragm.","Deep inspiration lowers the diaphragm and aerates the lungs, so ribs above the diaphragm are well seen.","Shallow breathing is used for sternum projections to blur lung markings.","Breath holding prevents motion."]},{"id":"ta7","c":"ta","t":"TH","q":"A patient has pain over the left lower posterior ribs after a fall. Which projection best demonstrates the injured ribs?","o":["Right posterior oblique (RPO), right side closest to the IR","Left posterior oblique (LPO), affected side closest to the IR","Right anterior oblique (RAO) with the right side closest to the IR","Lateral chest with the arms raised"],"a":1,"e":["The RPO places the right side near the IR and does not best show left axillary ribs.","For posterior oblique rib views, the injured side is positioned closest to the IR, so an LPO shows the left axillary portion of the ribs.","The RAO places the right anterior side against the IR.","A lateral chest does not isolate the ribs."]},{"id":"ta8","c":"ta","t":"TH","q":"The sternum is best demonstrated in an RAO position because:","o":["The heart shadow provides a homogeneous background for the sternum","It reduces dose to the thyroid","It removes the need for breath control","It allows a lower kVp"],"a":0,"e":["Rotating the patient moves the sternum over the heart shadow instead of the dense spine, giving a uniform background.","Thyroid dose is not the reason for the RAO.","Shallow breathing is still used to blur lung markings.","The RAO does not change the kVp requirement."]},{"id":"ta9","c":"ta","t":"TH","q":"A lateral soft tissue neck radiograph should be exposed at the end of:","o":["Deep expiration to bring the larynx up","Inspiration, filling the airway with air","Swallowing to move the larynx","A Valsalva maneuver to distend the pharynx"],"a":1,"e":["Expiration collapses the airway and reduces contrast.","Inspiration distends the pharynx and larynx with air, which provides contrast to demonstrate the soft tissues and airway.","Swallowing moves the larynx and obscures anatomy.","Valsalva changes pharyngeal anatomy and is not routine."]},{"id":"ta10","c":"ta","t":"TH","q":"On an AP chest radiograph of a child who swallowed a coin, the coin appears as a round disk (en face) projecting in the midline. This most likely indicates that it is located in the:","o":["Trachea","Esophagus","Right main bronchus","Stomach"],"a":1,"e":["Coins in the trachea typically lie on edge on the AP view because of the C-shaped tracheal cartilage.","The esophagus is flattened in the coronal plane, so a coin there is seen en face on the AP projection.","A coin in a bronchus is unusual and would be off midline.","A coin in the stomach would be below the diaphragm."]},{"id":"ta11","c":"ta","t":"TH","q":"A PICC line has been placed using fluoroscopic guidance with a C-arm. Where should the tip be positioned?","o":["In the right atrium","At the cavoatrial junction or lower SVC","In the right ventricle","In the subclavian vein"],"a":1,"e":["Tips in the atrium risk arrhythmias and perforation.","The tip is placed at or near the cavoatrial junction (lower SVC), which provides adequate blood flow for infusion.","The ventricle is too deep and risks arrhythmia.","The subclavian vein is too peripheral for the intended central position."]},{"id":"ta12","c":"ta","t":"AB","q":"Which projection is best for demonstrating free intraperitoneal air in a patient who cannot stand?","o":["Right lateral decubitus with the right side down","Left lateral decubitus with a horizontal beam","AP supine abdomen","Prone abdomen"],"a":1,"e":["With the right side down, air rises on the left, where it can be hidden within the stomach, and the liver does not provide contrast.","With the left side down, air rises toward the right side over the liver, away from gas in the bowel, and the liver provides a background.","Supine abdomen does not separate air from fluid.","A prone abdomen lacks a horizontal beam and fluid separation."]},{"id":"ta13","c":"ta","t":"AB","q":"An upright abdomen is taken after the patient has been in the upright position for 5 to 10 minutes. Why?","o":["To reduce the radiation dose","To let free air rise and fluid levels settle","To reduce patient motion","To eliminate the need for a grid"],"a":1,"e":["Waiting does not change dose.","Time upright allows gas to rise and fluid to layer, demonstrating air-fluid levels and free air under the diaphragm.","Waiting does not directly reduce motion.","Grid use is based on thickness and technique."]},{"id":"ta14","c":"ta","t":"AB","q":"A single-contrast esophagram is commonly performed in the RAO position because it:","o":["Projects the esophagus between the spine and the heart","Allows the stomach to fill with air","Improves visualization of the liver edge","Reduces peristalsis during the swallow"],"a":0,"e":["The RAO rotates the esophagus out of the spine and into the space between the spine and the heart, with less superimposition.","The stomach is not the primary target.","The liver is not the focus of an esophagram.","Positioning does not reduce peristalsis."]},{"id":"ta15","c":"ta","t":"AB","q":"In a swallowing dysfunction (modified barium swallow) study, who typically directs the consistencies of barium and food offered to the patient?","o":["The radiographer alone","A speech-language pathologist","The patient's family","The pharmacy"],"a":1,"e":["The radiographer assists with imaging and recording, but the clinical protocol is led by clinicians.","The SLP works with the radiologist to present different consistencies and evaluate swallowing function and aspiration risk.","Family members do not direct the exam.","The pharmacy supplies medications but does not guide the study."]},{"id":"ta16","c":"ta","t":"AB","q":"During a supine double-contrast upper GI series, where will the barium and air collect in the stomach?","o":["Barium in the fundus (posterior); air in the body and antrum","Barium in the antrum; air in the fundus","Barium and air mix evenly throughout","Barium only in the duodenum"],"a":0,"e":["The fundus is the most posterior portion, so barium pools there with the patient supine, while air rises to the more anterior body and antrum.","Air would rise to the antrum with the patient supine, not the fundus. Air in the fundus occurs when the patient is prone.","The two phases separate by gravity.","Barium also coats the stomach, not only the duodenum."]},{"id":"ta17","c":"ta","t":"AB","q":"A small bowel series with serial images is typically considered complete when:","o":["The barium reaches the ileocecal valve and enters the cecum","The barium reaches the stomach","Thirty minutes have passed regardless of progress","The barium has reached the rectum"],"a":0,"e":["Follow-through images are taken at intervals until barium has traversed the small bowel to the ileocecal valve and cecum.","Barium in the stomach is only the beginning of the study.","Transit time varies, so the study ends by progress and not a fixed time.","The study ends before the barium reaches the rectum."]},{"id":"ta18","c":"ta","t":"AB","q":"Which pair of barium enema positions best demonstrates the left colic (splenic) flexure?","o":["RAO and LPO","LAO and RPO","Both laterals","AP and PA only"],"a":1,"e":["The RAO and LPO open the right colic (hepatic) flexure.","LAO and RPO open the left colic (splenic) flexure and the descending colon.","Laterals demonstrate the rectum and are not used to open the flexures.","AP and PA do not separate flexures well."]},{"id":"ta19","c":"ta","t":"AB","q":"A patient is scheduled for a barium enema. Which preparation is typically required?","o":["A full meal the night before the exam","Clear liquids and bowel cleansing to empty the colon","No preparation is required for the exam","Intravenous contrast injected before the exam"],"a":1,"e":["Food residue remains in the colon and obscures the mucosa.","Clear liquids and laxatives or cleansing enemas remove stool that could mimic or hide lesions.","Retained stool compromises the exam and is a common cause of repeat studies.","Barium enema uses rectal, not IV, contrast."]},{"id":"ta20","c":"ta","t":"AB","q":"During ERCP, contrast is delivered into the biliary and pancreatic ducts by:","o":["Intravenous injection","Endoscopic cannulation of the ampulla of Vater","Oral ingestion of barium","A catheter through the femoral artery"],"a":1,"e":["IV contrast does not selectively fill the ducts.","The endoscope is passed to the duodenum, and a cannula through the major duodenal papilla (ampulla of Vater) delivers contrast under fluoroscopy.","Oral barium would not fill the ducts.","Femoral artery access is used for angiography."]},{"id":"ta21","c":"ta","t":"AB","q":"A radiograph is obtained to confirm placement of a newly inserted feeding tube (Dobbhoff) before feeding begins. Which finding confirms appropriate placement?","o":["The tip projects over the lung field","The tip projects below the diaphragm, in the stomach or duodenum","The tube is coiled within the esophagus","The tip lies at the level of the carina"],"a":1,"e":["A tip in the lung means the tube went into the airway, and feeding could cause aspiration.","The tip should lie below the diaphragm, confirming it passed through the esophagus into the stomach or beyond.","A coiled esophageal tube is not a safe position for feeding.","The carina is in the airway region, indicating a tracheobronchial position."]},{"id":"ta22","c":"ta","t":"GU","q":"Which contrast agent is used for a retrograde cystogram?","o":["Barium sulfate suspension via a urethral catheter","Dilute water-soluble iodinated contrast via a urethral catheter","Gadolinium-based contrast via a urethral catheter","Air instilled via a urethral catheter"],"a":1,"e":["Barium is not used in the urinary tract.","Water-soluble iodinated contrast, instilled retrograde through a catheter, fills the bladder and demonstrates leaks or fistulae.","Gadolinium is an MRI contrast agent.","Air does not adequately delineate the bladder wall in this exam."]},{"id":"ta23","c":"ta","t":"GU","q":"A voiding cystourethrogram (VCUG) is performed to demonstrate:","o":["The bladder and urethra during micturition","The kidneys and renal pelvis only","The gallbladder and bile ducts","The uterine tubes and cavity"],"a":0,"e":["The patient voids during imaging, showing the urethra and reflux into the ureters.","Kidneys are evaluated with other exams, such as retrograde urography or CT.","The gallbladder is imaged with ultrasound or cholangiography.","The uterine tubes are evaluated by hysterosalpingography."]},{"id":"ta24","c":"ta","t":"GU","q":"A male VCUG often includes a 30-degree RPO position to:","o":["Reduce the dose to the testes","Show the entire urethra without overlap by the pubic bones","Increase the filling of the bladder","Reduce the exposure time needed"],"a":1,"e":["Dose reduction is not the reason for obliquity.","The oblique position profiles the urethra, separating it from the bony structures and showing the entire length.","Obliquity does not change bladder filling.","Exposure time does not depend on obliquity."]},{"id":"ta25","c":"ta","t":"GU","q":"Retrograde urography involves:","o":["Intravenous injection of contrast with timed images","Contrast injected through ureteral catheters placed at cystoscopy","Oral contrast given the night before","Contrast instilled into the bladder only"],"a":1,"e":["Intravenous injection describes intravenous urography or CT urography.","Catheters are placed in the ureters by a urologist, and contrast is injected directly into the collecting system under fluoroscopy.","Oral contrast does not reach the urinary tract in a way that opacifies the collecting system.","Bladder-only injection describes cystography."]},{"id":"ta26","c":"ta","t":"GU","q":"Hysterosalpingography is usually scheduled shortly after menstruation (about days 6 to 12 of the cycle) because:","o":["The uterus is at its smallest at that time","It helps ensure no pregnancy and a thin endometrium","The ovaries are inactive at that time","Contrast is absorbed best at that time"],"a":1,"e":["Uterine size is not the reason for timing.","Scheduling after menses but before ovulation makes pregnancy unlikely and avoids a thick endometrium that could obscure findings.","Ovarian activity is not the deciding factor.","Contrast absorption is unrelated to timing."]},{"id":"ext1","c":"ext","t":"UE","q":"For a PA projection of the hand, the central ray is directed perpendicular to the:","o":["Third metacarpophalangeal joint","Wrist joint","Distal phalanx of the middle finger","Midforearm"],"a":0,"e":["The CR is centered at the third MCP joint so the entire hand is included with minimal distortion of the metacarpals.","The wrist joint is the center for wrist projections.","The distal phalanx is the center for a single finger projection.","The midforearm is for forearm projections."]},{"id":"ext2","c":"ext","t":"UE","q":"The Norgaard (ball catcher's) projection is a bilateral AP oblique hand exam used to evaluate:","o":["Scaphoid fractures of the wrist","Early inflammatory arthritis, such as rheumatoid arthritis","Narrowing of the carpal canal","Skeletal maturity (bone age)"],"a":1,"e":["Scaphoid fractures are evaluated with ulnar deviation or Stecher views.","The bilateral 45-degree oblique shows joint margins and early erosions, which is useful in rheumatoid arthritis.","The carpal canal is shown with the tangential Gaynor-Hart projection.","Bone age uses a PA hand and wrist for comparison with atlas standards."]},{"id":"ext3","c":"ext","t":"UE","q":"A PA wrist with ulnar deviation is used primarily to demonstrate the:","o":["The pisiform in profile","The scaphoid, with less foreshortening","The radial head and neck","The hook of the hamate"],"a":1,"e":["The pisiform is best seen on a lateral or oblique view.","Ulnar deviation moves the scaphoid out of its foreshortened position, elongating it so fractures are better seen.","The radial head is an elbow structure.","The hook of the hamate is shown with the carpal canal view."]},{"id":"ext4","c":"ext","t":"UE","q":"The tangential (Gaynor-Hart) wrist projection best demonstrates:","o":["The scaphoid waist","The carpal canal and the hook of the hamate","The distal radioulnar joint","The first carpometacarpal joint"],"a":1,"e":["The scaphoid waist is shown on ulnar deviation views.","With the wrist dorsiflexed and the CR directed tangentially, the carpal canal, pisiform, and hamate hook are seen in profile.","The distal radioulnar joint is seen on the lateral wrist.","The first carpometacarpal joint is seen on thumb projections."]},{"id":"ext5","c":"ext","t":"UE","q":"On a lateral elbow flexed 90 degrees, a visible posterior fat pad indicates:","o":["A normal finding on a 90-degree lateral","Joint effusion, possibly an occult fracture","Poor positioning of the elbow","Overexposure of the soft tissues"],"a":1,"e":["The posterior fat pad sits in the olecranon fossa and is normally not visible on a 90-degree lateral.","A visible posterior fat pad suggests fluid within the joint, often from a radial head or supracondylar fracture that may not be seen directly.","Positioning errors alter alignment of bony landmarks, not fat pad visibility.","Overexposure would reduce, not increase, soft tissue visibility."]},{"id":"ext6","c":"ext","t":"UE","q":"Which elbow projection demonstrates the radial head and neck free of superimposition by the ulna?","o":["AP elbow","Medial (internal) oblique, 45 degrees","Lateral (external) oblique, 45 degrees","Lateral, flexed 90 degrees"],"a":2,"e":["The AP view shows the radial head overlapping part of the ulna.","The medial oblique shows the coronoid process in profile and the radial head superimposed on the ulna.","With external rotation of 45 degrees, the radial head, neck, and tuberosity are projected free of the ulna.","The lateral view superimposes the radial head on the coronoid process."]},{"id":"ext7","c":"ext","t":"UE","q":"A patient cannot fully extend the elbow. What is the appropriate approach for an AP elbow?","o":["Force the elbow into full extension for a single AP view","Take two AP views: forearm parallel to the IR, then humerus parallel","Skip the AP and rely on the lateral and obliques","Use an AP axial projection of the shoulder instead"],"a":1,"e":["Forcing extension can worsen injury.","Partial flexion requires separate AP views of the humerus and the forearm, each with the part parallel to the IR to avoid distortion.","The AP view is part of the standard elbow series.","The shoulder is not the area of interest."]},{"id":"ext8","c":"ext","t":"UE","q":"Which lateral projection is used for a suspected fracture of the proximal humerus when the arm cannot be moved?","o":["Transthoracic lateral humerus","Inferosuperior axial","Tangential","Scapular Y"],"a":0,"e":["The transthoracic lateral is obtained without rotating the arm, with the unaffected arm raised and a breathing technique or suspended respiration.","The inferosuperior axial requires abduction of the arm.","Tangential views are used for the patella or carpal canal.","The scapular Y is used for scapular and glenohumeral relationships."]},{"id":"ext9","c":"ext","t":"UE","q":"On an AP shoulder in external rotation, which structure is demonstrated in profile laterally?","o":["Lesser tubercle","Greater tubercle","Coracoid process","Acromion"],"a":1,"e":["The lesser tubercle is in profile medially with internal rotation.","With the palm up and epicondyles parallel to the IR, the greater tubercle is seen in profile on the lateral side of the humeral head.","The coracoid is a scapular structure.","The acromion is a scapular structure."]},{"id":"ext10","c":"ext","t":"UE","q":"The Grashey (posterior oblique) shoulder projection is used to show:","o":["An open glenohumeral joint with minimal overlap of humeral head and glenoid","The acromioclavicular joint with and without weights","The coracoid process in an axial view","The bicipital groove in tangential profile"],"a":0,"e":["Rotating the patient 35 to 45 degrees toward the affected side places the glenoid fossa in profile.","The AC joint is evaluated with AP projections with and without weights.","The coracoid is best seen on an axial or AP axial view.","The bicipital groove is best shown on tangential views."]},{"id":"ext11","c":"ext","t":"UE","q":"The PA oblique (scapular Y) projection is most useful for evaluating:","o":["Anterior or posterior dislocation of the humeral head","The sternoclavicular joint in profile","The carpal bones in a lateral view","The lung apices free of the clavicles"],"a":0,"e":["The Y view is a lateral of the scapula, showing whether the humeral head sits anterior or posterior to the glenoid, which identifies dislocations.","The SC joint is evaluated with specific PA and oblique views.","The carpals are in the wrist.","Apices are shown on lordotic chest views."]},{"id":"ext12","c":"ext","t":"UE","q":"A supraspinatus outlet (Neer) projection is used to evaluate:","o":["Impingement at the supraspinatus outlet under the acromion","Fractures of the clavicular shaft","Narrowing of the carpal canal","Fractures of the lower ribs"],"a":0,"e":["The modified Y with a 10 to 15 degree caudad angle profiles the outlet under the acromion, helping identify subacromial impingement.","Clavicular fractures require clavicle projections.","Carpal canal narrowing needs a tangential wrist.","Ribs need rib projections."]},{"id":"ext13","c":"ext","t":"UE","q":"For weight-bearing AC joint projections, the weights are:","o":["Held firmly in the patient's hands during exposure","Hung from the wrists with the shoulders relaxed","Strapped across the patient's shoulders","Omitted, since the patient is standing upright"],"a":1,"e":["Gripping would contract the shoulder muscles and stabilize the joint.","Weights hung from the wrists let gravity stress the joint, showing separation if the ligaments are torn.","Weights on the shoulders would not stress the AC ligaments.","The purpose of the study is to compare images with and without weights."]},{"id":"ext14","c":"ext","t":"LE","q":"For an AP axial projection of the foot, the central ray is typically angled:","o":["10 degrees toward the heel","20 degrees toward the toes","40 degrees cephalad","Perpendicular only"],"a":0,"e":["A 10-degree posterior angle compensates for the longitudinal arch, opening joint spaces and reducing overlap.","An angle toward the toes would worsen foreshortening.","40 degrees cephalad is used for axial calcaneus.","The angle is part of the standard technique."]},{"id":"ext15","c":"ext","t":"LE","q":"For an AP oblique (medial) projection of the foot, the foot is rotated approximately:","o":["10 degrees","30 degrees","45 degrees","60 degrees"],"a":1,"e":["10 degrees is too little to separate the tarsals.","The foot is rotated about 30 degrees medially so the cuboid and the bases of the metatarsals are seen without overlap.","45 degrees is used for the ankle medial oblique.","60 degrees would superimpose structures again."]},{"id":"ext16","c":"ext","t":"LE","q":"Weight-bearing foot projections are most helpful for evaluating:","o":["Non-displaced fractures of the phalanges","The longitudinal arch under load, such as flatfoot","Fractures of the sesamoid bones","Calcaneal spurs and heel pain"],"a":1,"e":["Phalangeal fractures are well seen on non-weight-bearing views.","The arch flattens under body weight, so weight-bearing views show true arch height and pes planus or pes cavus.","Sesamoid views are special tangential projections.","Calcaneal spurs are seen on lateral and axial calcaneus views."]},{"id":"ext17","c":"ext","t":"LE","q":"For an axial plantodorsal calcaneus projection, the central ray is angled:","o":["40 degrees cephalad","40 degrees caudad","10 degrees cephalad","Perpendicular"],"a":0,"e":["A 40-degree cephalad angle projects the long axis of the calcaneus clear of the talus and ankle, with the foot dorsiflexed.","40 degrees caudad is used for the dorsoplantar axial calcaneus, with the patient prone.","10 degrees is too small to elongate the calcaneus.","A perpendicular CR would superimpose the calcaneus on the ankle."]},{"id":"ext18","c":"ext","t":"LE","q":"For an AP mortise projection of the ankle, the leg is internally rotated about:","o":["15 to 20 degrees, making the intermalleolar line parallel to the IR","45 degrees, with the foot dorsiflexed","5 degrees, with the toes pointed","90 degrees, for a true lateral"],"a":0,"e":["This rotation places the malleoli equidistant from the IR and opens the entire mortise joint space evenly.","45 degrees is used for the medial oblique ankle.","5 degrees is insufficient to open the mortise.","90 degrees would produce a lateral."]},{"id":"ext19","c":"ext","t":"LE","q":"A 45-degree medial oblique of the ankle best demonstrates:","o":["The distal tibiofibular joint, open without overlap","The calcaneus in axial profile","The talar dome in an open mortise","The sesamoid bones in tangential profile"],"a":0,"e":["At 45 degrees the tibiofibular joint is opened and the talus and lateral malleolus are well seen.","The calcaneus is seen on lateral and axial views.","The talar dome is shown best on the mortise projection.","Sesamoids require tangential foot views."]},{"id":"ext20","c":"ext","t":"LE","q":"On a properly positioned lateral ankle, the fibula should be superimposed on:","o":["The anterior half of the tibia","The posterior half of the tibia","The calcaneus","The navicular"],"a":1,"e":["The fibula lies posterior to the tibia, so anterior superimposition suggests rotation.","The fibula normally projects over the posterior half of the distal tibia on a true lateral.","The calcaneus is distal to the ankle joint.","The navicular is a tarsal bone anterior to the talus."]},{"id":"ext21","c":"ext","t":"LE","q":"An AP stress view of the ankle with forced inversion is performed to evaluate:","o":["Lateral ligament integrity, shown by widening of the lateral joint space","Bone density of the distal tibia","Non-displaced fractures of the tibia only","Ankle joint effusion and soft tissue swelling"],"a":0,"e":["Forced inversion stresses the lateral ligaments, and widening of the lateral joint space indicates laxity or tear.","Bone density is measured with densitometry.","Fractures are evaluated on routine views.","Effusion is evaluated on a lateral view."]},{"id":"ext22","c":"ext","t":"LE","q":"For a lateral knee projection, the central ray is typically angled:","o":["5 to 7 degrees cephalad","5 to 7 degrees caudad","20 degrees cephalad","Perpendicular"],"a":0,"e":["The cephalad angle compensates for the larger medial femoral condyle, superimposing the condyles.","Caudad angulation would worsen condylar separation.","20 degrees is too steep for a standard lateral.","A perpendicular beam leaves the condyles unsuperimposed."]},{"id":"ext23","c":"ext","t":"LE","q":"For an AP knee, a patient measures 26 cm from the ASIS to the tabletop. What CR angle is appropriate?","o":["3 to 5 degrees caudad","Perpendicular","3 to 5 degrees cephalad","15 degrees cephalad"],"a":2,"e":["Caudad angles are used for thin patients (less than about 19 cm).","Perpendicular is used for average patients (19 to 24 cm).","Patients over about 24 cm need a slight cephalad angle so the CR parallels the joint space.","15 degrees is too steep."]},{"id":"ext24","c":"ext","t":"LE","q":"Intercondylar fossa (tunnel) projections of the knee are particularly useful for demonstrating:","o":["Loose bodies or osteochondritis dissecans","Patellar fractures","Meniscal tears","Fibular head fractures"],"a":0,"e":["The intercondylar fossa and tibial spines are shown in profile, helping identify loose bodies and osteochondritis dissecans.","Patellar fractures are best shown on lateral or tangential views.","Meniscal tears require MRI or arthrography.","Fibular head views use oblique knee positions."]},{"id":"ext25","c":"ext","t":"LE","q":"Why must a patellar fracture be excluded before a tangential patella projection?","o":["Knee flexion could displace the fracture fragments","The tangential view requires a much higher radiation dose","The patient must be positioned prone for the exam","The patella cannot be visualized on any other view"],"a":0,"e":["Knee flexion pulls the quadriceps and can separate transverse fracture fragments.","Dose is not the main concern.","Prone positioning is not necessarily required for all tangential views.","The patella is visible on other views."]},{"id":"ext26","c":"ext","t":"LE","q":"Weight-bearing AP knee radiographs are commonly ordered to evaluate:","o":["Joint space narrowing from cartilage loss, as in osteoarthritis","Acute fractures in the multi-trauma patient only","Soft tissue foreign bodies around the joint","Skin lesions overlying the knee"],"a":0,"e":["Standing loads the joint, revealing narrowing that may be hidden on non-weight-bearing views.","Acute fractures are evaluated with trauma views.","Foreign bodies are evaluated with soft tissue techniques.","Skin lesions are not a radiographic target."]},{"id":"ext27","c":"ext","t":"LE","q":"A trauma patient with a suspected femoral shaft fracture requires a lateral femur. Which approach is appropriate?","o":["Rotate the leg medially to a true lateral position","Use a cross-table lateral without moving the injured limb","Have the patient stand against the upright Bucky","Skip the lateral and rely on the AP projection"],"a":1,"e":["Rotating the limb can displace the fracture and cause pain or injury.","A horizontal beam, with the receptor against the lateral thigh, avoids moving the injured leg.","Standing is unsafe.","Two perpendicular projections are the standard of care."]},{"id":"ext28","c":"ext","t":"OT","q":"For a bone age study, the radiograph is typically taken of the:","o":["The left hand and wrist, compared with atlas standards","The right knee, compared with atlas standards","The cervical spine, compared with growth charts","The pelvis, compared with an adult atlas"],"a":0,"e":["A PA of the left (non-dominant) hand and wrist is compared with an atlas, such as Greulich and Pyle, to assess skeletal maturity.","The knee is not the standard bone age site.","The cervical spine is not used in routine bone age assessment.","The pelvis is not used for routine bone age."]},{"id":"ext29","c":"ext","t":"OT","q":"A long bone measurement (scanogram or orthoroentgenogram) is used to:","o":["Measure leg-length discrepancy with minimal magnification","Measure bone mineral density of the long bones","Evaluate soft tissue masses along the shaft","Assess pulmonary function with serial images"],"a":0,"e":["Images of the hips, knees, and ankles with a calibrated ruler allow accurate length measurement, with the patient kept still between exposures.","Bone density uses densitometry.","Soft tissue masses are evaluated with ultrasound, CT, or MRI.","Lung function is evaluated with pulmonary tests."]},{"id":"ext30","c":"ext","t":"OT","q":"In a skeletal survey for suspected non-accidental trauma in an infant, the preferred approach is:","o":["One whole-body radiograph of the entire infant","Separate, collimated images of each body part","Only a chest radiograph centered on the thorax","Only skull and pelvis projections"],"a":1,"e":["A single whole-body image (babygram) lacks detail and is not recommended.","Individually collimated views of the skull, spine, ribs, long bones, hands, and feet allow detection of subtle fractures.","Limited imaging would miss fractures.","The survey must cover the full skeleton."]},{"id":"ext31","c":"ext","t":"OT","q":"A skeletal survey for suspected multiple myeloma is performed primarily to detect:","o":["Lytic lesions throughout the skeleton","Pulmonary nodules in both lung fields","Gallstones in the gallbladder","Kidney stones in the urinary tract"],"a":0,"e":["Myeloma produces punched-out lytic lesions, and a survey documents their distribution.","Lung nodules are evaluated with chest imaging or CT.","Gallstones are evaluated with ultrasound.","Kidney stones are evaluated with CT or ultrasound."]},{"id":"ext32","c":"ext","t":"OT","q":"After contrast is injected into the knee joint for arthrography, why is the patient often asked to move or exercise the joint?","o":["To spread the contrast through the joint","To reduce the radiation dose to the joint","To remove air bubbles from the joint","To obtain a lateral view of the knee"],"a":0,"e":["Movement spreads contrast across the joint surfaces, such as the menisci and cartilage, so they are outlined for imaging.","Dose is not affected by joint motion.","Air is not removed by movement.","The movement does not change the projection."]},{"id":"ext33","c":"ext","t":"OT","q":"During an arthrography procedure, a non-sterile radiographer needs to adjust the C-arm over the sterile field. Which action is correct?","o":["Reach over the sterile field to make the adjustment","Stay away from the sterile field, or ask the sterile operator to assist","Lay a lead apron across the sterile field","Remove the drape to reach the C-arm"],"a":1,"e":["Reaching over a sterile field risks contaminating it.","Non-sterile personnel avoid the field and use sterile drapes or assistance from sterile personnel to maintain asepsis.","Placing non-sterile items on the field breaks sterility.","Removing drapes defeats the purpose."]}]};
var CATS = DATA.cats, QS = DATA.qs;
var byId = {}, catBy = {}, subName = {}, subCat = {};
QS.forEach(function(q){ byId[q.id]=q; });
CATS.forEach(function(c){ catBy[c.k]=c; c.subs.forEach(function(s){ subName[s.k]=s.n; subCat[s.k]=c.k; }); });
var TOTAL_SCORED = CATS.reduce(function(a,c){return a+c.scored;},0);
var MOCK_MIN = 230;

/* ---------- storage ---------- */
var HK='arrt-rad2027-history-v1', SK='arrt-rad2027-session-v1', PK='arrt-rad2027-prefs-v1';
function lsGet(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
var H = lsGet(HK) || {};
var P = lsGet(PK) || {};

/* ---------- helpers ---------- */
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
function fmt(sec){ sec=Math.max(0,Math.round(sec)); var h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60; return (h?h+':':'')+(h&&m<10?'0':'')+m+':'+(s<10?'0':'')+s; }
function pct(a,b){ return b? Math.round(100*a/b):0; }
function cls(p){ return p>=75?'good':(p>=60?'mid':'low'); }
function $(sel,root){ return (root||document).querySelector(sel); }
var root = document.getElementById('app');

/* ---------- state ---------- */
var UI = Object.assign({ sel:null, n:25, src:'all', mode:'study', timed:false, open:{} }, P.ui||{});
if(!UI.sel){ UI.sel = []; CATS.forEach(function(c){ c.subs.forEach(function(s){ UI.sel.push(s.k); }); }); }
function saveUI(){ P.ui = UI; lsSet(PK,P); }
var S = null;           // active session
var screen = 'home';    // home | quiz | summary | results | review
var showNav = false;
var timerId = null;
var rf = 'all', ri = 0; // review filter / index

function saveSession(){ if(S && !S.finished) lsSet(SK,S); else lsDel(SK); }

/* ---------- pools ---------- */
function srcOK(id){
  var h=H[id];
  if(UI.src==='unseen') return !h || !h.n;
  if(UI.src==='missed') return h && h.last===false;
  if(UI.src==='flagged') return h && h.flag;
  return true;
}
function pool(){
  var sel = {}; UI.sel.forEach(function(k){ sel[k]=1; });
  return QS.filter(function(q){ return sel[q.t] && srcOK(q.id); });
}
function subCount(k){ return QS.filter(function(q){return q.t===k;}).length; }
function catCount(c){ return QS.filter(function(q){return q.c===c;}).length; }

/* ---------- session creation ---------- */
function makeSession(kind, ids, mode, limitSec, pilot){
  var perm = {}; ids.forEach(function(id){ perm[id]=shuffle([0,1,2,3]); });
  return { kind:kind, mode:mode, ids:ids, perm:perm, ans:{}, sub:{}, flag:{}, pilot:pilot||{}, i:0,
           timed:!!limitSec, limit:limitSec||0, remaining:limitSec||0, elapsed:0, counted:{}, finished:false };
}
function startCustom(){
  var p = shuffle(pool().map(function(q){return q.id;}));
  var n = UI.n==='all' ? p.length : Math.min(+UI.n, p.length);
  if(!n){ return; }
  var ids = p.slice(0,n);
  S = makeSession('custom', ids, UI.mode, UI.timed? n*60 : 0);
  go('quiz');
}
function startMock(){
  var ids = [], pilot = {};
  CATS.forEach(function(c){
    var list = shuffle(QS.filter(function(q){return q.c===c.k;}).map(function(q){return q.id;}));
    var np = Math.max(0, list.length - c.scored);
    list.forEach(function(id,i){ ids.push(id); if(i<np) pilot[id]=1; });
  });
  ids = shuffle(ids);
  S = makeSession('mock', ids, 'exam', MOCK_MIN*60, pilot);
  go('quiz');
}
function go(s){ screen=s; showNav=false; if(S) saveSession(); render(); window.scrollTo(0,0); startTimer(); }

/* ---------- timer ---------- */
function startTimer(){
  if(timerId){ clearInterval(timerId); timerId=null; }
  if(!S || S.finished || screen!=='quiz' && screen!=='summary' || !S.timed) return;
  var tick=0;
  timerId = setInterval(function(){
    if(!S || S.finished){ clearInterval(timerId); timerId=null; return; }
