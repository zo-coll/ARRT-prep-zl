<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b6b8a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ARRT Prep">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>ARRT Radiography Practice Exam (2027 Specs)</title>
<style>
:root{
  --bg:#f4f6f8;--card:#ffffff;--ink:#17212b;--muted:#5b6876;--line:#dde3ea;
  --pri:#0b6b8a;--pri-ink:#ffffff;--pri-soft:#e3f2f7;
  --ok:#1b7a47;--ok-soft:#e6f4ec;--bad:#b3261e;--bad-soft:#fbe9e7;
  --warn:#9a6700;--warn-soft:#fff4d6;--shadow:0 1px 2px rgba(20,30,40,.06),0 4px 16px rgba(20,30,40,.05);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#10161c;--card:#18212a;--ink:#e8edf2;--muted:#9aa8b6;--line:#2b3744;
  --pri:#4cb8d8;--pri-ink:#07212b;--pri-soft:#12313d;
  --ok:#5fcf93;--ok-soft:#14301f;--bad:#ff8a80;--bad-soft:#3a1b19;
  --warn:#f2c14e;--warn-soft:#3a2e10;--shadow:none}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:900px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(80px,calc(env(safe-area-inset-bottom) + 40px)) max(16px,env(safe-area-inset-left))}
button,.pill,summary{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input[type=checkbox],input[type=radio]{min-width:22px;min-height:22px}
h1{font-size:1.5rem;margin:0 0 4px;letter-spacing:-.01em}
h2{font-size:1.15rem;margin:0 0 10px}
h3{font-size:1rem;margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:720px){.grid2{grid-template-columns:1fr}}
.btn{border:1px solid var(--line);background:var(--card);padding:10px 16px;border-radius:10px;font-weight:600}
.btn:hover{border-color:var(--pri)}
.btn.pri{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:6px 10px;font-size:.88rem;border-radius:8px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.chip{display:inline-block;font-size:.78rem;padding:2px 9px;border-radius:99px;background:var(--pri-soft);color:var(--pri);font-weight:600}
.chip.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.banner{border:1px solid var(--warn);background:var(--warn-soft);border-radius:12px;padding:12px 14px;margin-bottom:16px}
.note{border-left:4px solid var(--pri);background:var(--pri-soft);padding:10px 12px;border-radius:0 10px 10px 0;font-size:.9rem}
/* blueprint table */
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--muted);font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.04em}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
/* topic picker */
details.cat{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--card)}
details.cat>summary{list-style:none;cursor:pointer;padding:10px 12px;display:flex;align-items:center;gap:10px}
details.cat>summary::-webkit-details-marker{display:none}
details.cat .subs{padding:2px 12px 10px 38px;display:grid;gap:4px}
label.chk{display:flex;align-items:center;gap:8px;cursor:pointer}
input[type=checkbox],input[type=radio]{width:18px;height:18px;accent-color:var(--pri);flex:none}
.cnt{margin-left:auto;color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.mini{height:6px;border-radius:4px;background:var(--line);overflow:hidden;width:70px}
.mini>i{display:block;height:100%;background:var(--ok)}
select{font:inherit;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.opts-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:6px}
.opts-row fieldset{border:0;padding:0;margin:0}
.opts-row legend{font-weight:600;font-size:.88rem;margin-bottom:6px;color:var(--muted)}
/* quiz */
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line);margin-bottom:14px}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--pri);transition:width .2s}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.timer.low{color:var(--bad)}
.stem{font-size:1.12rem;line-height:1.5;margin:10px 0 16px;font-weight:600}
.optwrap{margin-bottom:10px}
.opt{width:100%;text-align:left;display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card)}
.opt:hover:not(:disabled){border-color:var(--pri)}
.opt .let{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.85rem;color:var(--muted)}
.opt .otext{flex:1;padding-top:2px}
.opt.sel{border-color:var(--pri);background:var(--pri-soft)}
.opt.sel .let{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .let{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .let{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt:disabled{cursor:default;color:var(--ink)}
.tag{flex:none;font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:99px;align-self:center}
.tag.ok{background:var(--ok);color:#fff}
.tag.bad{background:var(--bad);color:#fff}
.why{margin:6px 0 0 40px;padding:8px 12px;border-left:3px solid var(--line);font-size:.93rem;color:var(--ink)}
.why.ok{border-color:var(--ok)}
.why.bad{border-color:var(--bad)}
.why b{display:block;font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.why.ok b{color:var(--ok)}
.why.bad b{color:var(--bad)}
.why.oth b{color:var(--muted)}
.foot{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px}
.verdict{font-weight:700;margin:4px 0 12px}
.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--bad)}
/* navigator */
.nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin:10px 0}
.nav button{height:36px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);font-size:.82rem;font-weight:600;position:relative}
.nav button.ans{background:var(--pri-soft);border-color:var(--pri);color:var(--pri)}
.nav button.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.nav button.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.nav button.cur{outline:2px solid var(--ink);outline-offset:1px}
.nav button.fl::after{content:"";position:absolute;top:2px;right:2px;width:8px;height:8px;border-radius:50%;background:var(--warn)}
/* results */
.big{font-size:3rem;font-weight:800;line-height:1;letter-spacing:-.02em}
.hbar{display:grid;grid-template-columns:minmax(120px,220px) 1fr 80px;gap:10px;align-items:center;margin:7px 0;font-size:.92rem}
@media(max-width:600px){.hbar{grid-template-columns:1fr 70px}.hbar .track{grid-column:1/-1;order:3}}
.track{height:12px;background:var(--line);border-radius:6px;overflow:hidden}
.track>i{display:block;height:100%}
.good{background:var(--ok)}.mid{background:var(--warn)}.low{background:var(--bad)}
.hbar .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.pill{display:inline-flex;gap:6px;align-items:center;padding:3px 10px;border:1px solid var(--line);border-radius:99px;background:var(--card);font-size:.85rem;cursor:pointer}
.pill.on{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
kbd{font:inherit;font-size:.78rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--card)}
</style>
</head>

<script>
(function(){
"use strict";
var DATA = {"cats":[{"k":"pc","name":"Patient Care","short":"Patient Care","scored":31,"group":"Patient Care","subs":[{"k":"EL","n":"Ethics, law & professionalism"},{"k":"IC","n":"Interpersonal communication"},{"k":"PA","n":"Patient assessment, transfer & body mechanics"},{"k":"ME","n":"Medical emergencies & life support"},{"k":"IN","n":"Infection control"},{"k":"HZ","n":"Hazardous materials & waste"},{"k":"PH","n":"Pharmacology & contrast media"}]},{"k":"ph","name":"Radiation Physics & Radiobiology","short":"Physics & Biology","scored":21,"group":"Safety","subs":[{"k":"XP","n":"X-ray production"},{"k":"TI","n":"Target interactions"},{"k":"PI","n":"Photon interactions with matter"},{"k":"UN","n":"Radiation units & quantities"},{"k":"RS","n":"Radiosensitivity & cell response"},{"k":"SE","n":"Biologic effects (stochastic & deterministic)"}]},{"k":"rp","name":"Radiation Protection","short":"Rad Protection","scored":25,"group":"Safety","subs":[{"k":"PT","n":"Patient protection & dose reduction"},{"k":"FL","n":"Fluoroscopy protection"},{"k":"PP","n":"Personnel & public protection"},{"k":"DL","n":"Dose limits & dosimetry"}]},{"k":"ia","name":"Image Acquisition & Evaluation","short":"Image Acquisition","scored":26,"group":"Image Production","subs":[{"k":"FQ","n":"Exposure factors & image quality"},{"k":"TC","n":"Technique selection & charts"},{"k":"DC","n":"Digital image concepts"},{"k":"IE","n":"Image evaluation & artifacts"}]},{"k":"eq","name":"Equipment Operation & Quality Assurance","short":"Equipment & QA","scored":25,"group":"Image Production","subs":[{"k":"EQ","n":"Imaging equipment"},{"k":"PD","n":"Digital detectors & image processing"},{"k":"QC","n":"Quality control & testing"}]},{"k":"hsp","name":"Head, Spine & Pelvis Procedures","short":"Head/Spine/Pelvis","scored":20,"group":"Procedures","subs":[{"k":"HD","n":"Head & skull"},{"k":"SP","n":"Spine & pelvis"}]},{"k":"ta","name":"Thorax & Abdomen Procedures","short":"Thorax & Abdomen","scored":22,"group":"Procedures","subs":[{"k":"TH","n":"Thorax"},{"k":"AB","n":"Abdomen & GI"},{"k":"GU","n":"Genitourinary"}]},{"k":"ext","name":"Extremity Procedures","short":"Extremities","scored":30,"group":"Procedures","subs":[{"k":"UE","n":"Upper extremity"},{"k":"LE","n":"Lower extremity"},{"k":"OT","n":"Other extremity topics"}]}],"qs":[{"id":"pc1","c":"pc","t":"EL","q":"A patient rolls up a sleeve and extends an arm as the radiographer approaches with a blood pressure cuff. This behavior is an example of which type of consent?","o":["Informed consent","Implied consent","Written consent","Surrogate consent"],"a":1,"e":["Informed consent requires a documented explanation of risks, benefits, and alternatives, which is not what is happening here; it is usually for invasive procedures.","Implied consent is shown through the patient's actions or behavior (cooperating, extending an arm) rather than spoken or written words.","Written consent means a signed document. The patient has not signed anything in this scenario.","Surrogate consent is given by a legally authorized person on behalf of a patient who cannot decide. This patient is acting for themselves."]},{"id":"pc2","c":"pc","t":"EL","q":"Which of the following communications about a patient is permitted under HIPAA?","o":["Telling a coworker in the cafeteria about an interesting fracture you imaged","Describing a patient's exam results to the patient's neighbor who is in the waiting room","Reporting a critical finding to the physician who is treating the patient","Posting a de-identified-looking image with the patient's initials on social media"],"a":2,"e":["Casual conversation in a public area about identifiable patients violates the minimum-necessary and privacy rules.","A neighbor has no need-to-know and no authorization from the patient, so this is a breach of confidentiality.","Sharing information with members of the care team who need it for treatment is a permitted use under HIPAA.","Initials, dates, and unique images can still identify a patient. Social media posting without authorization is a violation."]},{"id":"pc3","c":"pc","t":"EL","q":"A competent, alert outpatient is on the table for a lumbar spine exam. What is the best way to verify the patient's identity?","o":["Ask, 'Are you Mr. Garcia?' and accept a nod","Compare the room number on the requisition to the waiting room list","Ask the patient to state full name and date of birth and compare these with the order and wristband or ID","Check the name on the requisition against the name on the imaging system worklist only"],"a":2,"e":["A leading yes/no question can produce a false 'yes' from a confused or hard-of-hearing patient.","Location is not an identifier. Rooms and chairs change and cannot confirm identity.","Two identifiers obtained actively from the patient (name and DOB) and matched to the order is the accepted verification method.","Matching two documents to each other never confirms the person on the table is the person named on them."]},{"id":"pc4","c":"pc","t":"EL","q":"A competent patient states she does not want an exam, but the radiographer takes her arm and pulls her toward the table. Which legal term best describes the radiographer's action?","o":["Assault","Battery","Malpractice","Libel"],"a":1,"e":["Assault is a threat or attempt to touch someone without consent. Actual unwanted physical contact goes beyond assault.","Battery is unconsented physical contact. Touching or moving a patient who has refused is battery.","Malpractice is professional negligence involving a breach of the standard of care, not intentional unwanted touching.","Libel is written defamation of character and does not involve physical contact."]},{"id":"pc5","c":"pc","t":"EL","q":"A radiographer's negligent positioning causes a patient injury. The hospital may also be held legally responsible because of which doctrine?","o":["Res ipsa loquitur","Respondeat superior","Beneficence","Habeas corpus"],"a":1,"e":["Res ipsa loquitur ('the thing speaks for itself') means the injury itself implies negligence. It does not transfer responsibility to the employer.","Respondeat superior ('let the master answer') holds an employer liable for employees' wrongful acts committed within the scope of employment.","Beneficence is the ethical principle of acting in the patient's best interest and is not a liability doctrine.","Habeas corpus concerns unlawful detention and is unrelated to employer liability."]},{"id":"pc6","c":"pc","t":"EL","q":"Which statement correctly distinguishes the two parts of the ARRT Standards of Ethics?","o":["The Rules of Ethics are aspirational; the Code of Ethics is enforceable","The Code of Ethics is aspirational; the Rules of Ethics are mandatory and enforceable","Both are aspirational and carry no sanctions","Both are enforceable only for certified technologists who are employed"],"a":1,"e":["This reverses the two parts. The Rules are the enforceable portion.","The Code of Ethics expresses ideals to strive for, while the Rules of Ethics are mandatory minimum standards that can lead to sanctions when violated.","Violations of the Rules of Ethics can result in sanctions such as reprimand, probation, suspension, or revocation.","ARRT standards apply to certified and registered individuals and applicants regardless of current employment status."]},{"id":"pc7","c":"pc","t":"EL","q":"Which of the following is an unethical manipulation of electronic image data?","o":["Adjusting window level to improve visibility of a lung nodule","Using the electronic mask tool to make a wide exposure field appear tightly collimated","Annotating an accurate anatomic side marker that was placed within the field","Rotating the image to correct a displayed orientation error"],"a":1,"e":["Postprocessing brightness and contrast adjustment is acceptable when it does not misrepresent the patient or the exposure.","Electronically masking (shuttering) to disguise poor collimation conceals the true irradiated field and misrepresents the exam, which is unethical.","Documenting an accurate marker does not alter diagnostic content. Fabricating or substituting a marker would be a problem.","Orientation correction is acceptable if the image itself is not altered in a misleading way."]},{"id":"pc8","c":"pc","t":"IC","q":"A patient with limited English proficiency needs detailed pre-procedure instructions for a barium study. What is the best approach?","o":["Ask the patient's 12-year-old child to translate","Use a qualified medical interpreter","Speak more slowly and loudly in English","Skip the instructions and demonstrate during the exam"],"a":1,"e":["Family members, especially children, may mistranslate medical terms and compromise confidentiality.","A qualified medical interpreter ensures accurate, confidential communication and valid understanding of instructions.","Slower or louder English does not overcome a language barrier.","Essential preparation instructions (diet, laxatives, timing) must be understood beforehand to avoid repeat or cancelled exams."]},{"id":"pc9","c":"pc","t":"IC","q":"Which technique is most helpful when communicating with a patient who has a significant hearing impairment?","o":["Speak loudly from across the room","Face the patient with good lighting on your face and speak clearly","Use medical terminology to speed up the exam","Communicate only through the patient's family"],"a":1,"e":["Shouting distorts speech and can embarrass the patient. Speaking from a distance removes visual cues.","Facing the patient lets them use lip-reading and facial cues, and clear, normal-paced speech improves understanding.","Medical terminology reduces understanding in any patient and is especially unhelpful when hearing is limited.","The patient should be addressed directly and kept involved in their own care."]},{"id":"pc10","c":"pc","t":"IC","q":"A patient asks whether an MRI exposes them to the same radiation as a radiograph. The best response is:","o":["'MRI uses a low dose of X-rays.'","'MRI uses a strong magnetic field and radio waves, not ionizing radiation.'","'MRI uses gamma rays from a radioactive tracer.'","'You should ask your doctor; I cannot discuss other modalities.'"],"a":1,"e":["MRI does not use X-rays at all.","MRI uses a strong magnet and radiofrequency pulses. It involves no ionizing radiation, but it has its own safety considerations such as metal.","Gamma emission from tracers describes nuclear medicine, not MRI.","Radiographers are expected to give accurate basic information about other modalities and refer more complex questions appropriately."]},{"id":"pc11","c":"pc","t":"PA","q":"Which is the best body mechanics practice when helping a patient from a wheelchair to the radiographic table?","o":["Lock the brakes, bend at the knees, widen your base, keep the patient close","Bend at the waist with legs together to stay low","Pull the patient by the arms while leaning back","Twist your torso to rotate the patient onto the table"],"a":0,"e":["Locked wheels, a wide base, bent knees, and keeping the load close use leg muscles and protect the radiographer's back.","Bending at the waist places strain on the lumbar spine.","Pulling on a patient's arms risks shoulder injury to the patient and strain for you.","Twisting while lifting is a common cause of back injury. Pivot with your feet instead."]},{"id":"pc12","c":"pc","t":"PA","q":"While moving a patient from a stretcher to the table, the patient has an IV infusing. What must be done with the IV bag?","o":["Keep it below the level of the patient's heart","Keep it above the level of the IV insertion site","Disconnect it temporarily and reconnect afterward","Lay it on the patient's abdomen"],"a":1,"e":["Placing the bag below the vein can allow blood to back up into the tubing and stop the infusion.","Keeping the bag higher than the insertion site maintains gravity flow and prevents backflow.","Disconnecting breaks a closed system and introduces infection risk. Radiographers should not disconnect lines.","This risks kinking or pulling the line and does not keep the bag high enough for gravity flow."]},{"id":"pc13","c":"pc","t":"PA","q":"A patient with an indwelling urinary (Foley) catheter is being transferred to the table. Where should the collection bag be kept?","o":["Above the level of the bladder","Below the level of the bladder, never on the floor","Clamped and placed on the patient's chest","Disconnected from the catheter during the transfer"],"a":1,"e":["A bag above the bladder allows urine to flow back toward the bladder, which can cause infection.","Keeping the bag below bladder level promotes drainage and prevents reflux. Keeping it off the floor limits contamination.","Clamping can cause bladder distension and placing the bag on the chest is above the bladder.","Disconnecting breaks the closed system and increases infection risk."]},{"id":"pc14","c":"pc","t":"PA","q":"A patient on nasal cannula oxygen at 2 L/min must be transported to the imaging room. Which action is appropriate?","o":["Turn off the oxygen to avoid tubing tangles","Increase the flow rate to 6 L/min as a precaution","Continue oxygen with a portable source and keep the tubing from kinking","Remove the cannula for the duration of the exam"],"a":2,"e":["Discontinuing oxygen without an order can cause hypoxia.","Flow rates are changed only on an order or by authorized personnel, and excessive oxygen has risks.","Maintaining prescribed oxygen throughout the transfer and exam, with attention to tubing integrity, is correct.","Removing prescribed oxygen is not a radiographer's decision."]},{"id":"pc15","c":"pc","t":"PA","q":"Which set of vital signs falls within normal limits for a resting adult?","o":["BP 168/98 mmHg, pulse 72, respirations 16","BP 118/76 mmHg, pulse 78, respirations 16, SpO2 98%","BP 118/76 mmHg, pulse 128, respirations 16","BP 118/76 mmHg, pulse 78, respirations 32"],"a":1,"e":["A systolic reading near 170 and diastolic near 100 is hypertensive, even though pulse and respirations are normal.","Pulse 60-100, respirations 12-20, SpO2 of 95% or higher, and BP below 120/80 are normal for a resting adult.","A pulse of 128 is tachycardia (normal is about 60-100 bpm).","Respirations of 32 per minute is tachypnea (normal about 12-20 per minute)."]},{"id":"pc16","c":"pc","t":"PA","q":"An elderly patient is unsteady but able to walk with help. Which device is appropriate to assist ambulation to the imaging room?","o":["Hoyer lift","Gait belt","Slider board","Backboard"],"a":1,"e":["A Hoyer lift is a mechanical lift for fully dependent patients who cannot bear weight.","A gait belt placed around the waist gives the radiographer a secure hold to steady and guide a patient who can bear weight.","A transfer (slider) board bridges gaps for lateral transfers of patients who cannot stand.","A backboard is used for spinal immobilization or CPR, not assisted walking."]},{"id":"pc17","c":"pc","t":"ME","q":"A patient with a known latex allergy arrives for a fluoroscopic exam. What is the appropriate action?","o":["Use standard gloves and tubing because reactions are rare","Use latex-free gloves and supplies, including enema tips and tourniquets","Apply powder to the gloves to reduce exposure","Have the patient wear a latex mask"],"a":1,"e":["Latex reactions can progress to anaphylaxis, so exposure must be avoided.","All patient-contact supplies should be latex-free (nitrile or vinyl gloves, latex-free tourniquets, enema tips, catheters) to prevent a reaction.","Glove powder can carry latex proteins into the air and worsen exposure.","This is not a recognized precaution and introduces more latex exposure."]},{"id":"pc18","c":"pc","t":"ME","q":"According to current guidelines, adult chest compressions during CPR should be delivered at what rate and depth?","o":["60-80 per minute, 1 inch deep","100-120 per minute, at least 2 inches (5 cm) deep","140-160 per minute, 3 inches deep","80-100 per minute, 1 to 1.5 inches deep"],"a":1,"e":["This rate and depth are too slow and too shallow to maintain circulation.","Adult compressions are 100-120 per minute, at least 2 inches (5 cm) but not more than about 2.4 inches, with full chest recoil between compressions.","This is too fast and too deep, and risks injury and reduced filling between compressions.","Too slow and too shallow to be effective."]},{"id":"pc19","c":"pc","t":"ME","q":"A patient begins to have a generalized seizure on the radiographic table. Which action is appropriate?","o":["Place a tongue depressor between the teeth","Restrain the limbs to prevent movement","Protect the patient from injury, note the time, and call for help","Give the patient water to drink immediately"],"a":2,"e":["Objects in the mouth can break teeth or obstruct the airway.","Restraining during a seizure can cause fractures or dislocations.","Clear nearby objects, cushion the head, time the seizure, and activate the emergency response. Turn the patient onto their side when convulsing stops.","Giving fluids to a patient with altered consciousness risks aspiration."]},{"id":"pc20","c":"pc","t":"ME","q":"A diabetic patient who fasted for an exam becomes shaky, sweaty, and confused but is awake and able to swallow. What is the most appropriate response?","o":["Ignore the symptoms and finish the exam quickly","Notify the nurse or physician and follow protocol, which may include juice","Give an insulin injection to treat the high blood sugar","Place the patient in a warm room until the shaking stops"],"a":1,"e":["Delay can result in loss of consciousness or seizure.","These are signs of hypoglycemia. Prompt notification and giving fast-acting carbohydrate per facility protocol to a patient who can swallow is appropriate.","Insulin would lower blood sugar further and could be fatal.","Heat does not treat low blood glucose."]},{"id":"pc21","c":"pc","t":"ME","q":"While performing a portable chest radiograph on an intubated patient, you notice the endotracheal tube tip appears to be in the right mainstem bronchus. What should you do?","o":["Reposition the tube yourself","Tell the patient's family the tube is misplaced","Promptly report the finding to the nurse or physician and document it","Wait until the next shift to mention it"],"a":2,"e":["Adjusting tubes is outside the radiographer's scope and may cause harm.","Findings should be communicated to the health care team, not family, and the radiographer does not diagnose.","Critical findings affecting patient safety are communicated immediately to the responsible clinician and documented.","Delay can lead to lung collapse or other harm."]},{"id":"pc22","c":"pc","t":"IN","q":"A patient with a contaminated bedside table and a radiographer who touches it and then the x-ray tube handle illustrates which mode of transmission?","o":["Direct, droplet","Indirect, airborne","Indirect, vehicle-borne (fomite)","Indirect, vector-borne"],"a":2,"e":["Droplet spread occurs through large respiratory particles traveling short distances, such as sneezing.","Airborne spread involves small particles that remain suspended in air.","Contaminated inanimate objects (fomites) are vehicles that carry pathogens indirectly from one person to another.","Vector-borne transmission uses animals or insects such as mosquitoes."]},{"id":"pc23","c":"pc","t":"IN","q":"A patient with suspected active pulmonary tuberculosis needs a portable chest exam. Which precautions apply?","o":["Contact precautions with gown and gloves only","Droplet precautions with a surgical mask only","Airborne precautions with a fit-tested N95 respirator","No precautions are needed for portable exams"],"a":2,"e":["Gown and gloves address contact transmission. TB spreads through the air.","Surgical masks do not reliably filter airborne particles of this size.","Tuberculosis is spread by airborne particles, requiring a fit-tested N95 or higher respirator and ideally a negative pressure room.","Portable exams often occur at the bedside and still require protection."]},{"id":"pc24","c":"pc","t":"IN","q":"A patient is on contact precautions for Clostridioides difficile. Which hand hygiene method is most appropriate after leaving the room?","o":["Alcohol-based hand rub only","Soap and water handwashing","Rinsing hands with water","Wearing a second pair of gloves instead"],"a":1,"e":["Alcohol does not reliably kill C. difficile spores.","Mechanical friction with soap and running water physically removes spores and is the preferred method.","Water alone does not remove spores or organisms effectively.","Gloves are not a substitute for hand hygiene, which is required after glove removal."]},{"id":"pc25","c":"pc","t":"IN","q":"When removing PPE after caring for a patient on isolation precautions, which item should generally be removed first?","o":["Mask or respirator","Gloves","Gown","Eye protection after the mask"],"a":1,"e":["Masks and respirators are removed last, after leaving the patient room and after other PPE.","Gloves are the most contaminated item and are removed first, followed by eye protection, gown, and then mask, with hand hygiene at the end.","Gown is removed after gloves and eye protection in standard CDC sequences.","The mask comes off last, not before eye protection."]},{"id":"pc26","c":"pc","t":"IN","q":"The primary purpose of neutropenic (reverse) isolation is to:","o":["Protect the health care workers from the patient","Protect an immunocompromised patient from infectious agents","Contain airborne infections within a negative pressure room","Prevent spread of C. difficile spores"],"a":1,"e":["That describes transmission-based isolation, not reverse isolation.","Reverse isolation protects patients with very low neutrophil counts from pathogens carried by staff, visitors, and the environment.","Negative pressure rooms are used for airborne infectious patients, which is the opposite direction of protection.","C. difficile requires contact precautions to protect others, not neutropenic isolation."]},{"id":"pc27","c":"pc","t":"IN","q":"Which statement correctly distinguishes disinfection from sterilization?","o":["Disinfection destroys all microorganisms including spores; sterilization does not","Sterilization destroys all microbial life including spores; disinfection does not necessarily","They are identical processes","Sterilization only reduces the number of bacteria on a surface"],"a":1,"e":["This reverses the two terms.","Sterilization eliminates all microbial life including spores, while disinfection destroys most pathogenic organisms but may not kill resistant spores.","They are different levels of microbial control.","Reducing numbers describes sanitation. Sterilization is complete elimination."]},{"id":"pc28","c":"pc","t":"HZ","q":"Where would a radiographer find hazards, handling instructions, and first aid information for a cleaning chemical used in the department?","o":["The patient's chart","The Safety Data Sheet (SDS)","The radiology information system","The ARRT handbook"],"a":1,"e":["The chart contains patient information, not chemical hazard data.","The SDS provides hazard identification, safe handling and storage, first aid, spill response, and disposal information for chemicals.","The RIS manages scheduling and reports.","The ARRT handbook covers certification, not workplace chemical safety."]},{"id":"pc29","c":"pc","t":"HZ","q":"Supplies contaminated by chemotherapy agents should be discarded in:","o":["Regular trash with other patient supplies","A designated chemotherapy or hazardous waste container","The linen hamper with contaminated linens","A radioactive waste container"],"a":1,"e":["Cytotoxic drugs can harm staff and the environment if placed in regular trash.","Chemotherapy waste requires designated hazardous waste containers according to policy.","Linen hampers are for contaminated linens, not hazardous drug waste.","Radioactive waste containers are for radioactive materials, not cytotoxic drugs."]},{"id":"pc30","c":"pc","t":"PH","q":"A patient scheduled for an IV iodinated contrast study reports taking metformin, and the most recent eGFR is 25 mL/min. What should the radiographer do?","o":["Proceed with the injection since metformin is unrelated","Notify the radiologist or ordering provider before the injection","Give a double dose of contrast to compensate","Tell the patient to take extra metformin afterward"],"a":1,"e":["Metformin plus reduced kidney function raises the risk of contrast-associated kidney injury and lactic acidosis, so it is not unrelated.","Low eGFR and metformin use require physician review before contrast, who may postpone, hydrate, or hold the drug per guidelines.","Increasing the contrast dose is never a compensation and increases nephrotoxicity risk.","Extra metformin could worsen the risk of lactic acidosis."]},{"id":"pc31","c":"pc","t":"PH","q":"A patient has orders for an upper GI series, an IV urogram, and a barium enema. Which sequence best prevents one exam from compromising another?","o":["Upper GI, barium enema, IV urogram","IV urogram, barium enema, upper GI","Barium enema, upper GI, IV urogram","Upper GI, IV urogram, barium enema"],"a":1,"e":["Retained barium from the UGI would obscure the kidneys and colon on later exams.","The IV urogram uses iodinated contrast and comes first, then the barium enema, since barium from an upper GI study can remain in the colon for days.","Barium from the enema could remain and obscure the kidneys on the urogram.","Barium from the UGI would interfere with the urogram and enema."]},{"id":"pc32","c":"pc","t":"PH","q":"Which contrast agent is preferred for a GI study in a patient with suspected bowel perforation?","o":["Barium sulfate suspension","Water-soluble iodinated contrast","Air only","Gadolinium-based contrast"],"a":1,"e":["Barium leaking into the peritoneum can cause severe inflammation and adhesions (barium peritonitis).","Water-soluble iodinated contrast is absorbed by the body if it leaks and is the agent of choice when perforation is suspected.","Air alone does not demonstrate the leak and is not a contrast agent for this purpose.","Gadolinium is an MRI agent, not used for radiographic GI studies."]},{"id":"pc33","c":"pc","t":"PH","q":"Which finding after IV iodinated contrast injection indicates a severe, life-threatening reaction?","o":["Warmth and a metallic taste","Nausea","Scattered mild hives","Stridor with hypotension"],"a":3,"e":["Warmth and metallic taste are common, expected sensations and are not allergic.","Nausea is typically a mild physiologic reaction.","Limited hives are usually a mild reaction needing observation, though they can progress.","Airway compromise (stridor, laryngeal edema) with hypotension suggests anaphylaxis, requiring immediate emergency response."]},{"id":"pc34","c":"pc","t":"PH","q":"During a power injection of IV contrast, the patient reports burning and you notice swelling at the injection site. What is the first action?","o":["Continue the injection to finish the scan","Stop the injection immediately and notify the radiologist or nurse","Increase the injection rate to finish sooner","Apply a tourniquet above the site"],"a":1,"e":["Continuing increases the volume of contrast infiltrating surrounding tissue.","These signs indicate extravasation. Stop the injection, notify appropriate staff, assess, elevate the limb, apply compresses per protocol, and document.","Increasing the rate worsens tissue damage.","A tourniquet is not part of extravasation management."]},{"id":"pc35","c":"pc","t":"PH","q":"Which pair of laboratory tests is most useful for assessing kidney function before administration of iodinated contrast?","o":["Hemoglobin and hematocrit","BUN and creatinine (with eGFR)","Platelet count and INR","Sodium and potassium"],"a":1,"e":["These assess oxygen-carrying capacity, not kidney function.","BUN, serum creatinine, and the calculated eGFR indicate how well the kidneys will clear contrast.","Platelet count and INR reflect clotting, not kidney function.","Electrolytes can be affected by kidney disease but do not directly measure filtration."]},{"id":"pc36","c":"pc","t":"PH","q":"A physician orders 2 mL/kg of contrast for a pediatric patient who weighs 44 lb. What volume should be given? (1 kg = 2.2 lb)","o":["22 mL","40 mL","88 mL","96.8 mL"],"a":1,"e":["This is 0.5 mL/kg, not 2 mL/kg, or results from dividing instead of multiplying.","44 lb / 2.2 = 20 kg, and 20 kg x 2 mL/kg = 40 mL.","This multiplies the pounds by 2 instead of converting to kilograms first.","This multiplies 44 lb by 2.2 instead of dividing, producing the wrong unit conversion."]},{"id":"ph1","c":"ph","t":"XP","q":"Which process supplies the free electrons needed for x-ray production in a radiographic tube?","o":["Photoelectric absorption at the anode","Thermionic emission at the heated filament","Bremsstrahlung at the target","Compton scattering in the glass envelope"],"a":1,"e":["Photoelectric absorption is a photon interaction with matter. It does not create the electron cloud in the tube.","When the filament (cathode) is heated by current, electrons are boiled off its surface. This is thermionic emission.","Bremsstrahlung is the interaction that produces x-ray photons when electrons slow down. It does not generate the electrons.","Compton scattering is a photon interaction and is not a source of tube electrons."]},{"id":"ph2","c":"ph","t":"XP","q":"Which exposure factor determines the kinetic energy (speed) of electrons as they strike the anode target?","o":["Filament current","Exposure time","Peak kilovoltage (kVp)","Focal spot size"],"a":2,"e":["Filament current determines how many electrons are available (tube current, mA), not their speed.","Exposure time determines how long electrons flow, which affects quantity but not energy.","kVp is the potential difference across the tube. A higher kVp accelerates electrons faster, giving each photon more energy.","Focal spot size affects spatial resolution and heat distribution, not electron energy."]},{"id":"ph3","c":"ph","t":"XP","q":"The negatively charged focusing cup surrounding the filament functions to:","o":["Increase the temperature of the filament","Keep the electron stream narrow and aimed at the focal track","Generate characteristic radiation at the target","Rotate the anode during the exposure"],"a":1,"e":["Filament temperature is controlled by filament current, not the focusing cup.","Electrons repel each other. The negatively charged cup repels them toward a narrow stream aimed at the target.","Characteristic radiation arises from inner-shell ionization in the target atoms.","The anode is rotated by an induction motor with a stator and rotor."]},{"id":"ph4","c":"ph","t":"XP","q":"Approximately what percentage of the electron kinetic energy striking the anode is converted to x-ray photons in diagnostic radiography?","o":["1%","20%","50%","99%"],"a":0,"e":["About 99% of the energy becomes heat and only about 1% becomes x-rays, which is why anode heat management is critical.","This overstates x-ray production by a factor of about 20.","Half of the energy becoming x-rays would eliminate most tube heating concerns, which is not the case.","About 99% is the heat fraction. The question asks about the x-ray fraction."]},{"id":"ph5","c":"ph","t":"TI","q":"Which target interaction accounts for the majority of the x-ray photons in a diagnostic x-ray beam?","o":["Bremsstrahlung","Characteristic","Photodisintegration","Coherent scattering"],"a":0,"e":["Bremsstrahlung ('braking') radiation occurs when projectile electrons are slowed by the nuclear field of a target atom, producing a continuous spectrum that makes up most of the beam.","Characteristic radiation contributes a smaller portion and only occurs at kVp above the K-shell binding energy of the target.","Photodisintegration is a high-energy photon interaction (above about 10 MeV) and does not occur in the diagnostic range.","Coherent scattering is a photon-tissue interaction, not a target interaction in the tube."]},{"id":"ph6","c":"ph","t":"TI","q":"Characteristic x-rays from a tungsten target are produced only when the tube operates at or above approximately:","o":["20 kVp","50 kVp","70 kVp","120 kVp"],"a":2,"e":["20 kVp is well below the 69.5 keV needed to remove a K-shell electron in tungsten.","50 kVp is still below the K-shell binding energy of tungsten.","The K-shell binding energy of tungsten is about 69.5 keV, so a projectile electron needs at least about 70 kV to ionize it and produce K characteristic photons.","120 kVp is above the threshold, but characteristic radiation begins at around 70 kVp, not 120."]},{"id":"ph7","c":"ph","t":"TI","q":"An exposure using 10 mAs at 40 inches SID produces the desired receptor exposure. To maintain the same receptor exposure at 48 inches SID, which mAs should be used?","o":["6.9 mAs","8.3 mAs","12 mAs","14.4 mAs"],"a":3,"e":["This reverses the squared distance ratio and also errs in rounding. Increasing distance requires more, not less, mAs.","This is 10 divided by 1.2, which is a linear (not squared) adjustment in the wrong direction.","This is a linear adjustment (10 x 1.2). The inverse square law requires the distance ratio to be squared.","mAs2 = mAs1 x (d2/d1)^2 = 10 x (48/40)^2 = 10 x 1.44 = 14.4 mAs."]},{"id":"ph8","c":"ph","t":"TI","q":"Compared with photons in a 60 kVp beam, photons in a 100 kVp beam have, on average:","o":["Lower frequency and longer wavelength","Higher frequency and shorter wavelength","Higher frequency and longer wavelength","The same frequency and wavelength"],"a":1,"e":["This describes lower-energy photons.","Photon energy is directly proportional to frequency and inversely proportional to wavelength. Higher kVp yields higher average energy, higher frequency, and shorter wavelength.","Frequency and wavelength are inversely related, so one cannot increase while the other also increases.","kVp changes the energy spectrum, so frequency and wavelength shift."]},{"id":"ph9","c":"ph","t":"PI","q":"Which photon interaction results in total absorption of the incident photon and contributes the most to patient dose?","o":["Coherent scattering","Compton scattering","Photoelectric absorption","Pair production"],"a":2,"e":["Coherent scattering changes the photon direction without ionization or energy absorption and is not a major dose contributor.","Compton scattering absorbs only part of the photon energy, producing a scattered photon.","In photoelectric absorption the photon gives all its energy to an inner-shell electron, so all of the energy is deposited in the patient. It produces high subject contrast and higher dose.","Pair production requires photon energy above 1.02 MeV and does not occur in diagnostic radiography."]},{"id":"ph10","c":"ph","t":"PI","q":"Which interaction is the primary source of scattered radiation that fogs the image and exposes radiographers during fluoroscopy?","o":["Photoelectric absorption","Compton scattering","Characteristic radiation","Photodisintegration"],"a":1,"e":["Photoelectric absorption removes the photon and produces no scattered photon in the beam.","In Compton scattering, a photon ejects an outer-shell electron and continues in a new direction with less energy. This scatter reduces contrast and is the main occupational exposure source.","Characteristic radiation in the tube is produced at the target, not by scatter in the patient.","Photodisintegration requires very high-energy photons and is not relevant in diagnostic radiology."]},{"id":"ph11","c":"ph","t":"PI","q":"As kVp is increased, which change occurs in photon interactions within the patient?","o":["The relative proportion of photoelectric absorption increases, increasing contrast","The relative proportion of Compton scatter increases and photoelectric absorption decreases, reducing subject contrast","Coherent scatter becomes the dominant interaction","Absorption stops occurring"],"a":1,"e":["Photoelectric probability falls as photon energy rises (roughly 1/E^3), so this has it backwards.","Higher-energy photons penetrate more and are less likely to be absorbed photoelectrically, so the Compton share rises and subject contrast decreases.","Coherent scatter is significant only at very low energies, below about 10 keV.","Absorption and scatter still occur, only in different proportions."]},{"id":"ph12","c":"ph","t":"UN","q":"Which pairing of SI unit and radiation quantity is correct?","o":["Gray - absorbed dose; sievert - dose equivalent; coulomb per kilogram - exposure","Gray - dose equivalent; sievert - absorbed dose; coulomb per kilogram - air kerma","Sievert - exposure; gray - effective dose; becquerel - absorbed dose","Coulomb per kilogram - absorbed dose; gray - exposure; sievert - activity"],"a":0,"e":["Gy measures energy absorbed per kg, Sv accounts for radiation type and tissue (dose equivalent and effective dose), and C/kg measures ionization in air (exposure).","Gy is absorbed dose (or air kerma) and Sv is a biologically weighted quantity. These are mismatched.","Becquerel is the unit of activity, not absorbed dose, and exposure is in C/kg.","Activity is measured in becquerels, not sieverts."]},{"id":"ph13","c":"ph","t":"UN","q":"A radiographer's occupational dose is reported as 2 rem. What is this equivalent in SI units?","o":["0.2 mSv","2 mSv","20 mSv","200 mSv"],"a":2,"e":["This is off by a factor of 100.","This would apply if 1 rem equaled 1 mSv, which is incorrect.","1 rem = 10 mSv (1 Sv = 100 rem), so 2 rem = 20 mSv.","200 mSv would equal 20 rem."]},{"id":"ph14","c":"ph","t":"UN","q":"Which quantity best allows comparison of stochastic risk from different radiographic exams that expose different regions of the body?","o":["Entrance skin exposure","Air kerma","Effective dose","Exposure in C/kg"],"a":2,"e":["Skin exposure ignores the sensitivity of the organs actually irradiated.","Air kerma describes energy transferred to air at a point and does not account for biologic risk.","Effective dose (Sv) weights absorbed dose by radiation type and tissue radiosensitivity, so partial-body exams can be compared as whole-body risk equivalents.","Exposure is an ionization measure in air and does not describe tissue risk."]},{"id":"ph15","c":"ph","t":"RS","q":"According to the law of Bergonié and Tribondeau, which cell type is the most radiosensitive?","o":["Mature nerve cells","Lymphocytes","Muscle cells","Mature bone cells"],"a":1,"e":["Mature nerve cells are specialized, nondividing, and among the most radioresistant.","Lymphocytes are an exception: although mature, they are among the most radiosensitive cells. Immature, rapidly dividing cells are generally most sensitive.","Muscle cells are highly differentiated and radioresistant.","Mature bone cells are relatively resistant compared with dividing cells."]},{"id":"ph16","c":"ph","t":"RS","q":"Which type of radiation has the highest linear energy transfer (LET) and relative biologic effectiveness (RBE)?","o":["Diagnostic x-rays","Gamma rays","Alpha particles","Beta particles"],"a":2,"e":["Diagnostic x-rays are low-LET radiation.","Gamma rays are low-LET electromagnetic radiation.","Alpha particles are heavy and highly ionizing, depositing large energy over a short path, so they have high LET and high RBE.","Beta particles are low to moderate LET."]},{"id":"ph17","c":"ph","t":"RS","q":"Cells irradiated in a well-oxygenated environment, compared with hypoxic cells, are:","o":["More radiosensitive","Less radiosensitive","Equally radiosensitive","Immune to the effects"],"a":0,"e":["Oxygen fixes free-radical damage (the oxygen effect), so well-oxygenated tissue shows greater biologic damage for the same dose.","Hypoxic cells are the less sensitive ones, which is why hypoxic tumor regions resist radiotherapy.","Oxygen status measurably changes sensitivity, with an oxygen enhancement ratio around 2-3 for low-LET radiation.","No cells are immune to radiation."]},{"id":"ph18","c":"ph","t":"SE","q":"Which of the following is classified as a stochastic effect of radiation?","o":["Skin erythema","Cataract formation","Radiation-induced cancer","Temporary sterility"],"a":2,"e":["Erythema is a deterministic tissue reaction with a dose threshold.","Cataracts are a deterministic effect with a threshold dose.","Stochastic effects (cancer, heritable effects) have no threshold; probability, not severity, rises with dose.","Temporary sterility has a threshold dose and is deterministic."]},{"id":"ph19","c":"ph","t":"SE","q":"In acute radiation syndrome, the stage with no obvious symptoms before the illness appears is the:","o":["Prodromal stage","Latent period","Manifest illness stage","Recovery stage"],"a":1,"e":["The prodromal stage includes nausea, vomiting, and fatigue shortly after exposure.","The latent period follows the prodromal stage and appears symptom-free, though damage is developing. It shortens as dose increases.","Manifest illness is the stage with clear symptoms of the specific syndrome.","Recovery occurs after the illness for survivors."]},{"id":"ph20","c":"ph","t":"SE","q":"Which acute radiation syndrome is primarily caused by destruction of intestinal epithelial cells, leading to death within days?","o":["Hematopoietic syndrome","Gastrointestinal syndrome","Central nervous system syndrome","Cutaneous syndrome"],"a":1,"e":["The hematopoietic syndrome results from bone marrow depletion and causes death over weeks.","The GI syndrome results from loss of the intestinal lining after higher doses, causing fluid loss, infection, and death within days.","The CNS syndrome occurs at very high doses with death within hours to days from neurologic and vascular damage.","Cutaneous syndrome involves skin injury and is not primarily fatal through gut failure."]},{"id":"ph21","c":"ph","t":"SE","q":"Which stage of embryonic and fetal development is associated with the greatest risk of congenital malformations from radiation exposure?","o":["Preimplantation (first 1-2 weeks)","Early organogenesis","Third trimester","Neonatal period"],"a":1,"e":["Preimplantation exposure tends to cause an all-or-nothing outcome, with lethal effects rather than malformations.","During organogenesis the major organs form and are most vulnerable to structural malformations.","Late gestation exposure is associated mainly with growth effects and increased childhood cancer risk.","The neonatal period is after birth and is not part of embryonic or fetal development."]},{"id":"ph22","c":"ph","t":"SE","q":"The approximate whole-body LD 50/30 for humans without medical intervention is:","o":["0.3-0.4 Gy","3-4 Gy","30-40 Gy","300-400 Gy"],"a":1,"e":["This is ten times too low and would cause only mild blood changes.","LD 50/30 is the dose expected to kill half of an exposed population within 30 days, approximately 3-4 Gy for humans without treatment.","This would cause CNS syndrome with death within hours or days.","This is vastly beyond survivable levels."]},{"id":"ph23","c":"ph","t":"SE","q":"Which radiation-induced malignancy has the shortest latent period?","o":["Breast cancer","Leukemia","Thyroid cancer","Lung cancer"],"a":1,"e":["Solid tumors such as breast cancer typically have long latent periods, often decades.","Leukemia has the shortest latent period, appearing approximately 2 to 5 years after exposure.","Thyroid cancer is a solid tumor with a latent period longer than leukemia.","Lung and other solid cancers have latencies measured in decades."]},{"id":"ph24","c":"ph","t":"SE","q":"The same total dose delivered over an extended time produces less biologic damage than if delivered in a short time primarily because of:","o":["Increased oxygen effect","Cellular repair and recovery between exposures","Higher LET of the radiation","Greater photoelectric absorption"],"a":1,"e":["Oxygen status influences sensitivity but does not explain the dose-rate effect.","Lower dose rates and fractionation give cells time to repair sublethal damage and repopulate, reducing biologic effect.","LET depends on radiation type, not on how the dose is spread over time.","Photon interactions depend on energy and tissue composition, not on time."]},{"id":"rp1","c":"rp","t":"PT","q":"A technique of 70 kVp and 20 mAs produces an acceptable image. Applying the 15% rule to reduce patient dose while keeping receptor exposure about the same, which technique is most appropriate?","o":["60 kVp, 40 mAs","80 kVp, 10 mAs","70 kVp, 10 mAs","80 kVp, 20 mAs"],"a":1,"e":["Reducing kVp by 15% would require doubling mAs, which increases patient dose.","Raising kVp by 15% (70 to about 80) and halving the mAs keeps receptor exposure about the same, while lowering patient dose because the beam is more penetrating.","Halving mAs alone would underexpose the receptor to about half.","Raising kVp by 15% without reducing mAs would roughly double receptor exposure."]},{"id":"rp2","c":"rp","t":"PT","q":"Which statement best describes the primary purpose of beam restriction in terms of patient protection?","o":["It increases the quantity of radiation reaching the receptor","It reduces the volume of tissue irradiated and the amount of scatter produced","It increases the average energy of the beam","It eliminates the need for a grid in all examinations"],"a":1,"e":["Collimation does not increase beam quantity. It limits the field.","Limiting the field size reduces the irradiated tissue volume and scatter, lowering patient dose and improving contrast.","Raising average beam energy is done with added filtration or higher kVp, not collimation.","Collimation reduces scatter but does not replace grids when they are indicated."]},{"id":"rp3","c":"rp","t":"PT","q":"The minimum total filtration (inherent plus added) required in the useful beam for diagnostic tubes operating above 70 kVp is:","o":["0.5 mm Al equivalent","1.5 mm Al equivalent","2.5 mm Al equivalent","5.0 mm Al equivalent"],"a":2,"e":["This is far below the regulatory minimum.","1.5 mm Al is the minimum for tubes operating below 50 kVp.","Federal regulation and NCRP recommendations require at least 2.5 mm Al equivalent for tubes operating above 70 kVp (2.0 mm for 50-70 kVp).","5.0 mm would degrade output substantially and is not the required minimum."]},{"id":"rp4","c":"rp","t":"PT","q":"A female patient scheduled for a lumbar spine series tells the radiographer she might be pregnant. What is the most appropriate action?","o":["Proceed with the exam and mention it afterward","Cancel the exam and send the patient home","Notify the radiologist or physician before exposing, per facility policy","Increase kVp to reduce the fetal dose"],"a":2,"e":["Possible pregnancy must be evaluated before an exam that directly irradiates the pelvis or abdomen.","Cancelling the exam is not the radiographer's decision.","The radiographer should follow the facility's pregnancy policy and let the physician weigh the risks and benefits, which may involve pregnancy testing, modification, or postponement.","Changing exposure factors does not address whether the exam should proceed."]},{"id":"rp5","c":"rp","t":"PT","q":"Which approach is most effective for reducing repeat exposures in an uncooperative pediatric patient?","o":["Using the longest possible exposure time","Using immobilization devices, clear communication, and the shortest possible exposure time","Lowering the kVp to improve contrast","Having the parent hold the child without any lead protection"],"a":1,"e":["Long exposure times increase motion blur and repeats.","Immobilization, simple explanations, and short exposure times reduce motion, repeats, and dose, which aligns with Image Gently principles.","Lower kVp increases patient dose and does not address motion.","Any person holding a patient must wear a lead apron and gloves as appropriate, and immobilization aids should be used first."]},{"id":"rp6","c":"rp","t":"PT","q":"As a general rule, a radiographic grid is most appropriate for anatomy thicker than about:","o":["5 cm","10 cm","15 cm","25 cm"],"a":1,"e":["Thin parts produce little scatter, so a grid is unnecessary and would add dose.","Grids are generally used when part thickness exceeds about 10 cm and kVp is above about 60, when scatter becomes significant.","The threshold is lower than this.","A threshold of 25 cm is too high. Many parts above 10 cm benefit from grid use."]},{"id":"rp7","c":"rp","t":"PT","q":"A dose area product (DAP) meter measures:","o":["Absorbed dose in the patient's skin only","Air kerma multiplied by the area of the x-ray beam","The scatter reaching the radiographer","The kVp delivered to the tube"],"a":1,"e":["DAP is measured in the beam, not within tissue, and is not limited to skin.","DAP is the product of air kerma and the x-ray field area (Gy x cm2), so it rises with larger collimated fields.","Scatter to personnel is measured with dosimeters.","kVp is a tube-setting parameter and is not measured by DAP."]},{"id":"rp8","c":"rp","t":"PT","q":"Why is patient overexposure more likely to go unnoticed with digital receptors than with film-screen systems?","o":["Digital receptors are less sensitive to radiation","Wide dynamic range and rescaling can yield an acceptable image despite overexposure","Digital systems always limit the mAs automatically","Digital images cannot demonstrate quantum noise"],"a":1,"e":["Digital receptors are generally sensitive and do not hide dose through lower sensitivity.","Processing rescales the data, so overexposed images can look normal, which can lead to exposure creep unless the exposure indicator is monitored.","Systems do not automatically limit mAs for manual exposures.","Digital images show quantum noise when underexposed, not when overexposed."]},{"id":"rp9","c":"rp","t":"PT","q":"A digital detector with a higher detective quantum efficiency (DQE) would allow:","o":["Higher patient dose for the same image quality","The same image quality at a lower patient dose","Elimination of the exposure indicator","Lower spatial resolution at all frequencies"],"a":1,"e":["Higher DQE means more efficient use of photons, so dose does not need to rise.","DQE describes how efficiently a detector converts incident photons to useful signal, so a higher DQE yields better SNR for the same dose or equal quality for less dose.","Exposure indicators remain necessary regardless of DQE.","DQE does not imply reduced resolution."]},{"id":"rp10","c":"rp","t":"FL","q":"Compared with continuous fluoroscopy, pulsed fluoroscopy reduces patient dose because:","o":["It uses a higher kVp than continuous fluoroscopy","The beam is on only during short pulses rather than continuously","It increases the field of view during the study","It eliminates automatic brightness control"],"a":1,"e":["The reduction is due to beam-on time, not simply a kVp change.","Delivering a limited number of pulses per second reduces total beam-on time and therefore dose.","Larger fields do not reduce dose and may increase the irradiated area.","Brightness control remains in place with pulsed fluoroscopy."]},{"id":"rp11","c":"rp","t":"FL","q":"The last image hold feature in fluoroscopy contributes to dose reduction by:","o":["Raising the kVp automatically to shorten the exam","Allowing the operator to review the last image without continued exposure","Increasing the mA to improve the image","Reducing the SID to shorten the beam path"],"a":1,"e":["Last image hold does not change kVp.","The last frame stays on the monitor after exposure ends, so the operator can review without continuous radiation, reducing fluoroscopy time.","Increasing mA would raise dose.","It has no effect on SID."]},{"id":"rp12","c":"rp","t":"FL","q":"Federal regulations require the minimum source-to-skin distance (SSD) for stationary fluoroscopic units to be at least:","o":["12 inches (30 cm)","15 inches (38 cm)","24 inches (60 cm)","40 inches (100 cm)"],"a":1,"e":["12 inches (30 cm) is the minimum for mobile fluoroscopic units (C-arms).","Stationary fluoroscopes must have a minimum SSD of 15 inches (38 cm) under 21 CFR.","24 inches exceeds the regulatory minimum, though longer distances reduce skin dose.","40 inches is a common SID for radiography and not the fluoroscopy SSD minimum."]},{"id":"rp13","c":"rp","t":"FL","q":"Without a high-level control activated, the maximum permitted tabletop exposure rate during fluoroscopy is about:","o":["22 mGy(a)/min (2.5 R/min)","88 mGy(a)/min (10 R/min)","176 mGy(a)/min (20 R/min)","352 mGy(a)/min (40 R/min)"],"a":1,"e":["This is well below the regulatory limit.","The normal limit is 10 R/min, approximately 88 mGy(a)/min air kerma rate at the tabletop.","176 mGy(a)/min is the maximum with a high-level control activated, which requires audible or visual signal.","This exceeds any regulatory limit."]},{"id":"rp14","c":"rp","t":"FL","q":"Which statement about the fluoroscopic cumulative timer is correct?","o":["It resets automatically every 30 seconds","It signals or interrupts exposure after 5 minutes of fluoroscopy","It records only the total mA used","It is required only on mobile units"],"a":1,"e":["Automatic resets would defeat the purpose of tracking total time.","The cumulative timer gives an audible alarm or interrupts the beam at 5 minutes, so the operator tracks total beam-on time, and the radiologist is made aware.","The timer tracks time, not mA.","Cumulative timers are required on fluoroscopic equipment generally."]},{"id":"rp15","c":"rp","t":"PP","q":"The primary source of occupational radiation exposure to a radiographer during fluoroscopy is:","o":["The primary beam","Leakage radiation from the tube housing","Scatter radiation from the patient","Radiation from the image intensifier"],"a":2,"e":["The radiographer should never be in the primary beam, and the beam is attenuated by the patient and the receptor.","Leakage is limited by regulation to 1 mGy/h at 1 m and contributes much less than scatter.","Compton scatter from the patient is the dominant source of occupational exposure during fluoroscopy.","The receptor absorbs the beam and is not a major source of exposure to personnel."]},{"id":"rp16","c":"rp","t":"PP","q":"A radiographer is exposed to 16 microGy per hour at 1 meter from a patient during a procedure. Approximately what exposure rate would be received at 2 meters?","o":["2 microGy per hour","4 microGy per hour","8 microGy per hour","32 microGy per hour"],"a":1,"e":["This would require a fourfold increase in distance.","By the inverse square law, doubling distance reduces intensity to one quarter: 16 / 4 = 4 microGy/h.","This is a linear (not squared) reduction.","This would occur if distance were halved."]},{"id":"rp17","c":"rp","t":"PP","q":"The minimum lead equivalent for protective aprons worn by personnel during fluoroscopy is:","o":["0.1 mm Pb","0.25 mm Pb","0.5 mm Pb","2.0 mm Pb"],"a":2,"e":["This is insufficient attenuation for fluoroscopic scatter.","0.25 mm Pb is the minimum for items such as Bucky slot covers and protective curtains and drapes.","NCRP #102 specifies a minimum of 0.5 mm Pb equivalent for protective aprons used in fluoroscopy.","2.0 mm Pb would be impractically heavy."]},{"id":"rp18","c":"rp","t":"PP","q":"What is the minimum lead equivalent required for a fluoroscopic Bucky slot cover and protective curtain?","o":["0.05 mm Pb","0.25 mm Pb","0.5 mm Pb","1.0 mm Pb"],"a":1,"e":["This is far too thin for these accessories.","Bucky slot covers and protective curtains require at least 0.25 mm Pb equivalent.","0.5 mm Pb is the apron standard, not the minimum for these accessories.","1.0 mm Pb exceeds the requirement for these items."]},{"id":"rp19","c":"rp","t":"PP","q":"Which is the proper way to store a lead apron?","o":["Folded in half in a drawer","Hung on a rack or laid flat","Rolled tightly and stored in a bag","Left crumpled on a chair"],"a":1,"e":["Folding creates creases and cracks in the lead lining.","Hanging on a proper hanger or laying flat protects the lead lining from cracks, which are checked with periodic inspection.","Rolling can damage the lining in the same way as folding.","Crumpling damages the lining and creates gaps in protection."]},{"id":"rp20","c":"rp","t":"PP","q":"The fluoroscopic exposure switch must be which type?","o":["A toggle that stays on until turned off","A dead-man switch that stops exposure when released","A foot switch that can be taped down","A timer-based switch that runs 5 minutes"],"a":1,"e":["A latching switch could continue irradiating when the operator is distracted.","A dead-man switch requires continuous pressure, so releasing it terminates radiation, which is a safety requirement.","Defeating the switch violates safety regulations.","Exposure must be controlled by the operator at all times, not by a fixed run time."]},{"id":"rp21","c":"rp","t":"DL","q":"Which personnel dosimeter uses aluminum oxide and is read with laser light?","o":["Thermoluminescent dosimeter (TLD)","Optically stimulated luminescence (OSL) dosimeter","Film badge","Pocket ionization chamber"],"a":1,"e":["TLDs use lithium fluoride and release light when heated.","OSL dosimeters contain aluminum oxide, which stores energy from radiation and releases light when stimulated by laser, so they are reread and are common today.","Film badges use photographic emulsion that darkens with exposure.","Pocket ionization chambers measure charge loss in a gas-filled chamber."]},{"id":"rp22","c":"rp","t":"DL","q":"A declared pregnant radiographer is issued a second dosimeter. Where should it be worn?","o":["Outside the lead apron at the collar","At the waist level under the lead apron","On the finger as a ring","In the pocket during off-duty hours"],"a":1,"e":["The collar badge outside the apron estimates dose to unshielded areas such as the thyroid and eyes.","The fetal badge is worn at waist level beneath the apron to estimate dose to the embryo or fetus.","Ring badges monitor the hands for those with high extremity exposure.","Dosimeters should be worn only during occupational exposure."]},{"id":"rp23","c":"rp","t":"DL","q":"The recommended annual occupational effective dose limit for radiation workers is:","o":["1 mSv","5 mSv","50 mSv","500 mSv"],"a":2,"e":["1 mSv per year is the public limit for continuous exposure.","5 mSv is the public limit for infrequent exposure and has been used for fetal total dose.","The annual occupational whole-body effective dose limit is 50 mSv.","500 mSv per year is the occupational equivalent dose limit for extremities, skin, and similar tissues."]},{"id":"rp24","c":"rp","t":"DL","q":"The recommended monthly equivalent dose limit for an embryo or fetus of a declared pregnant radiographer is:","o":["0.05 mSv","0.5 mSv","5 mSv","50 mSv"],"a":1,"e":["This is ten times lower than the guideline.","The recommended limit is 0.5 mSv in any month, with a total of 5 mSv for the entire gestation.","5 mSv is the total allowed for the gestation, not the monthly limit.","50 mSv is the annual occupational limit for the mother."]},{"id":"rp25","c":"rp","t":"DL","q":"The recommended effective dose limit for members of the public from continuous or frequent exposure is:","o":["0.1 mSv per year","1 mSv per year","10 mSv per year","50 mSv per year"],"a":1,"e":["This is lower than the recommended value.","The public limit is 1 mSv per year for continuous or frequent exposure (5 mSv for infrequent exposure).","10 mSv exceeds the public limit.","50 mSv per year is the occupational limit."]},{"id":"rp26","c":"rp","t":"DL","q":"The NCRP recommended annual occupational equivalent dose limit for the lens of the eye is:","o":["5 mSv","15 mSv","50 mSv","150 mSv"],"a":2,"e":["5 mSv is much lower than the occupational recommendation.","15 mSv was the older NCRP public-exposure limit for the lens, not the occupational recommendation.","NCRP Report No. 180 recommends 50 mSv per year for the lens of the eye (reduced from 150 mSv).","150 mSv was the previous recommendation before NCRP 180."]},{"id":"rp27","c":"rp","t":"DL","q":"Using the cumulative effective dose guideline of 10 mSv multiplied by age, what is the recommended lifetime limit for a 30-year-old radiographer?","o":["30 mSv","150 mSv","300 mSv","1500 mSv"],"a":2,"e":["This would be 1 mSv per year of age.","This is 5 mSv per year of age, which is not the guideline.","10 mSv x 30 years = 300 mSv cumulative effective dose.","1500 mSv exceeds the guideline by a factor of five."]},{"id":"rp28","c":"rp","t":"FL","q":"Which fluoroscopic feature typically increases patient dose when activated?","o":["Pulsed fluoroscopy","Last image hold","Magnification mode (smaller field of view)","Collimation of the beam"],"a":2,"e":["Pulsed fluoroscopy reduces beam-on time and dose.","Last image hold reduces dose by letting the operator review without exposure.","Magnification mode uses a smaller input area, and the system raises the exposure rate to maintain image brightness and quantum statistics, increasing patient dose.","Collimation reduces the irradiated volume and dose."]},{"id":"rp29","c":"rp","t":"PP","q":"During a mobile radiographic exam, which practice best protects the radiographer?","o":["Stand 3 feet from the patient with no apron","Stand at least 6 feet (2 m) away in a lead apron, outside the primary beam","Stand directly behind the patient in line with the beam","Hold the receptor in place for patients who cannot hold it"],"a":1,"e":["Three feet with no shielding gives much higher exposure from scatter.","Mobile units have an exposure cord at least 6 feet long so the operator can stand at 6 feet or more with an apron, away from the primary beam and the most intense scatter.","Standing in line with the beam exposes the radiographer to the primary beam.","Holding a receptor exposes the radiographer to scatter. Use holding devices or other personnel who are not occupationally exposed when needed."]},{"id":"ia1","c":"ia","t":"FQ","q":"An exposure of 200 mA at 0.1 second produces the desired receptor exposure. Which combination produces approximately the same receptor exposure?","o":["400 mA at 0.1 second","100 mA at 0.1 second","400 mA at 0.05 second","300 mA at 0.2 second"],"a":2,"e":["This yields 40 mAs, double the original 20 mAs.","This yields 10 mAs, half the original.","400 mA x 0.05 s = 20 mAs, identical to 200 mA x 0.1 s = 20 mAs. Receptor exposure follows mAs under the reciprocity law.","This yields 60 mAs, three times the original."]},{"id":"ia2","c":"ia","t":"FQ","q":"Increasing kVp, with all other factors adjusted to maintain receptor exposure, will have what effect on image contrast?","o":["Contrast increases","Contrast decreases (longer scale)","Contrast is unchanged","Contrast is eliminated"],"a":1,"e":["Higher contrast results from lower kVp, where photoelectric absorption differences are emphasized.","Higher kVp increases Compton interactions and penetration, reducing differential absorption and producing a longer scale of contrast.","kVp is the primary controller of subject contrast, so it changes.","Contrast remains, but at a lower level."]},{"id":"ia3","c":"ia","t":"FQ","q":"A part is positioned 4 inches from the receptor using a 40-inch SID. What is the approximate magnification factor? (MF = SID / SOD)","o":["1.00","1.11","1.25","1.40"],"a":1,"e":["There is an OID, so some magnification is present.","SOD = 40 - 4 = 36 inches, so MF = 40 / 36 = 1.11, or about 11% magnification.","This would be a larger OID of about 8 inches.","This would require a much larger OID relative to SID."]},{"id":"ia4","c":"ia","t":"FQ","q":"Which combination of factors provides the best spatial resolution?","o":["Large focal spot, short SID, long OID","Small focal spot, long SID, short OID","Small focal spot, short SID, long OID","Large focal spot, long SID, short OID"],"a":1,"e":["Each of these factors degrades resolution by increasing geometric blur and magnification.","Small focal spot reduces penumbra, long SID reduces divergence and magnification, and short OID keeps the object near the receptor.","The short SID and long OID increase magnification and blur.","The large focal spot increases penumbra even when SID and OID are favorable."]},{"id":"ia5","c":"ia","t":"FQ","q":"Which focal spot size and application are correctly matched?","o":["Large focal spot for fine detail extremity imaging","Small focal spot for fine detail imaging at lower mAs","Small focal spot for abdominal exams requiring high mAs","Large focal spot to reduce motion blur and improve spatial resolution"],"a":1,"e":["Large focal spots increase penumbra and reduce detail.","Small focal spots improve resolution but tolerate less heat, so they suit low-mAs, fine-detail exams.","High mAs exams need the large focal spot for heat capacity.","A large focal spot allows short exposure times to reduce motion but reduces geometric sharpness."]},{"id":"ia6","c":"ia","t":"FQ","q":"An exposure of 10 mAs without a grid yields the desired receptor exposure. What mAs is required with a 12:1 grid (grid conversion factor of 5)?","o":["12 mAs","25 mAs","50 mAs","120 mAs"],"a":2,"e":["This adds a flat 2 mAs and does not apply the conversion factor.","This applies a conversion factor of 2.5, not 5.","New mAs = original mAs x GCF = 10 x 5 = 50 mAs.","This multiplies by the grid ratio (12) rather than the conversion factor."]},{"id":"ia7","c":"ia","t":"FQ","q":"Which appearance results from using a focused grid upside down?","o":["Uniform decrease in exposure across the entire image","Severe cutoff on both lateral edges, with exposure near the center","Grid lines running in the opposite direction","No visible effect on the image"],"a":1,"e":["A uniform decrease is typical of off-level or off-center errors, not an inverted grid.","An upside-down focused grid has lead strips angled away from the diverging beam, causing severe peripheral cutoff on both sides.","Grid line direction is determined by the strip orientation, not by flipping.","The effect is dramatic and obvious."]},{"id":"ia8","c":"ia","t":"FQ","q":"For an AP thoracic spine radiograph, which positioning best uses the anode heel effect?","o":["Place the anode end over the thicker (lower) portion","Place the cathode end over the thicker (lower) portion","Position the tube perpendicular to the spine's center","Use a small focal spot only"],"a":1,"e":["The anode side has lower intensity, which would worsen exposure on the thicker end.","Beam intensity is greater on the cathode side, so the thicker lower thoracic region is placed under the cathode for more uniform receptor exposure.","Perpendicular centering does not control the intensity gradient.","Focal spot size does not alter the heel effect distribution."]},{"id":"ia9","c":"ia","t":"FQ","q":"What is the most effective way to minimize involuntary motion, such as peristalsis, in a radiograph of the abdomen?","o":["Reduce the mA","Use the shortest possible exposure time","Increase the OID","Use a longer SID with lower mA"],"a":1,"e":["Reducing mA lengthens the time needed for a given mAs.","A short exposure time freezes involuntary motion, so higher mA with a shorter time is selected.","A larger OID increases blur and magnification.","Lower mA requires a longer time to reach the same mAs."]},{"id":"ia10","c":"ia","t":"FQ","q":"Which pathologic condition would typically require a decrease in exposure factors?","o":["Pneumonia","Ascites","Emphysema","Pleural effusion"],"a":2,"e":["Pneumonia is an additive condition that increases density and requires more exposure.","Ascites adds fluid in the abdomen and requires increased exposure.","Emphysema is a destructive condition that increases air in the lungs, so exposure is typically decreased.","Pleural effusion is additive and typically needs increased exposure."]},{"id":"ia11","c":"ia","t":"FQ","q":"Adding filtration to the primary beam results in which change?","o":["Increased average beam energy and decreased beam intensity","Decreased average beam energy and increased beam intensity","No change in the beam","Increased skin dose"],"a":0,"e":["Filters preferentially remove low-energy photons, so the remaining beam is harder (higher average energy) and lower in quantity, with reduced skin dose.","This reverses the effect of filtration.","Filtration changes both beam quality and quantity.","Filtration reduces skin dose by removing low-energy photons that would be absorbed in the skin."]},{"id":"ia12","c":"ia","t":"FQ","q":"A part is angled relative to the receptor while the central ray is perpendicular to the receptor. What distortion results?","o":["Elongation of the object","Foreshortening of the object","Magnification only","No distortion"],"a":1,"e":["Elongation typically arises when the tube or receptor is angled relative to the part.","An angled part is foreshortened because its projected length shrinks relative to its true length.","Magnification relates to OID and SID rather than angulation.","Part angulation changes the projected shape."]},{"id":"ia13","c":"ia","t":"TC","q":"A fixed kVp technique chart for a given body part varies which exposure factor with part thickness?","o":["kVp","mAs","SID","Focal spot size"],"a":1,"e":["In a fixed kVp system, kVp stays constant for that exam.","The chart keeps kVp constant and adjusts mAs according to measured thickness.","SID is generally constant for the exam.","Focal spot is selected by detail needs, not thickness steps."]},{"id":"ia14","c":"ia","t":"TC","q":"Which statement about anatomically programmed radiography (APR) is correct?","o":["It removes the need to consider patient size or condition","Stores preset techniques for each exam, which may need adjusting for the patient","It applies one technique to all exams","It prevents the use of AEC"],"a":1,"e":["APR techniques are starting points. Patient size, pathology, and casts still require judgment.","APR provides preprogrammed techniques and processing for each anatomic selection, with adjustments for individual patients.","APR provides different techniques for different exams.","APR can include AEC s
